        ctx.fillStyle = '#2a2320'; // the opening through to the galley
        ctx.fillRect(it.x-11, it.y-18, 22, 26);
        ctx.strokeStyle = '#c9a24b'; ctx.lineWidth = 1.6;
        ctx.strokeRect(it.x-11, it.y-18, 22, 26);
        ctx.fillStyle = '#e9dcc0'; // a plated dish waiting to go out
        ctx.beginPath(); ctx.ellipse(it.x, it.y+14, 10, 5, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = SILHOUETTE_DARK; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(it.x, it.y+14, 10, 5, 0, 0, Math.PI*2); ctx.stroke();
        break;
      }
      case 'locker': {
        ctx.fillStyle = '#4a3f33';
        ctx.fillRect(it.x-14, it.y-26, 28, 52); ctx.strokeRect(it.x-14, it.y-26, 28, 52);
        ctx.strokeStyle = 'rgba(201,162,75,0.55)'; ctx.lineWidth = 1;
        ctx.strokeRect(it.x-10, it.y-22, 20, 20);
        ctx.strokeRect(it.x-10, it.y+2, 20, 20);
        ctx.fillStyle = '#f4ecdc'; // folded linen on the shelf
        ctx.fillRect(it.x-8, it.y-19, 16, 5);
        ctx.fillRect(it.x-8, it.y+5, 16, 5);
        break;
      }
      case 'washstand': {
        ctx.fillStyle = '#5c3a24';
        ctx.fillRect(it.x-18, it.y-4, 36, 26); ctx.strokeRect(it.x-18, it.y-4, 36, 26);
        ctx.fillStyle = '#e9dcc0'; // enamel basins
        ctx.beginPath(); ctx.ellipse(it.x-8, it.y+2, 7, 4.5, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(it.x+8, it.y+2, 7, 4.5, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#7a9ab3'; // mirror above
        ctx.fillRect(it.x-12, it.y-24, 24, 18);
        ctx.strokeStyle = '#c9a24b'; ctx.lineWidth = 1.6;
        ctx.strokeRect(it.x-12, it.y-24, 24, 18);
        break;
      }
      case 'hatch': {
        ctx.fillStyle = '#2a2320';
        ctx.fillRect(it.x-16, it.y-20, 32, 40); ctx.strokeRect(it.x-16, it.y-20, 32, 40);
        ctx.strokeStyle = '#8a6f2f'; ctx.lineWidth = 2;
        ctx.strokeRect(it.x-11, it.y-15, 22, 30);
        ctx.fillStyle = '#c9a24b'; // wheel handle
        ctx.beginPath(); ctx.arc(it.x, it.y, 6, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(it.x, it.y, 2, 0, Math.PI*2); ctx.fill();
        break;
      }
      default: break; // 'none' — nothing extra (e.g. the stair landing, the clock)
    }
  }

  function drawGrandClock(ctx, x, y, t){
    ctx.save();
    ctx.fillStyle = '#4a3221';
    ctx.beginPath(); ctx.arc(x, y, 19, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e9dcc0';
    ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#c9a24b'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, 17, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = SILHOUETTE_DARK; ctx.lineWidth = 1;
    for (let i = 0; i < 12; i++){
      const a = (i/12)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a)*12, y + Math.sin(a)*12);
      ctx.lineTo(x + Math.cos(a)*14, y + Math.sin(a)*14);
      ctx.stroke();
    }
    // hands track the hours the captain has left in the working day
    const spent = (state.hoursMax - state.hours) / Math.max(state.hoursMax, 1);
    const hourAngle = -Math.PI/2 + spent * Math.PI * 1.5;
    const minuteAngle = -Math.PI/2 + t * 0.4;
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(hourAngle)*7.5, y + Math.sin(hourAngle)*7.5); ctx.stroke();
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(minuteAngle)*11, y + Math.sin(minuteAngle)*11); ctx.stroke();
    ctx.fillStyle = '#c9a24b';
    ctx.beginPath(); ctx.arc(x, y, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawInteractable(ctx, it, inRange, t){
    if (inRange){
      const pulse = 16 + Math.sin(t*4)*2.5;
      const g = ctx.createRadialGradient(it.x, it.y, 2, it.x, it.y, pulse+8);
      g.addColorStop(0, 'rgba(232,148,79,0.34)');
      g.addColorStop(1, 'rgba(232,148,79,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(it.x, it.y, pulse+8, 0, Math.PI*2); ctx.fill();
    }
    if (it.type === 'clock') drawGrandClock(ctx, it.x, it.y, t);
    else drawPropShape(ctx, it, t);

    if (inRange){
      const bob = Math.sin(t*3) * 2.5;
      ctx.font = '19px serif';
      ctx.textAlign = 'center';
      ctx.fillText(it.icon, it.x, it.y - 34 + bob);
    }
  }

  function drawFloor(ctx, map){
    const f = map.floor;
    ctx.fillStyle = f.base;
    ctx.fillRect(0, 0, map.width, map.height);
    ctx.lineWidth = 1;
    if (f.style === 'parquet'){
      // alternating inlaid squares, like a first-class entrance hall
      const size = 38;
      for (let yy = 0; yy < map.height; yy += size){
        for (let xx = 0; xx < map.width; xx += size){
          const alt = ((xx/size | 0) + (yy/size | 0)) % 2 === 0;
          ctx.fillStyle = alt ? f.plank : f.base;
          ctx.fillRect(xx, yy, size, size);
          ctx.strokeStyle = 'rgba(0,0,0,0.13)';
          ctx.strokeRect(xx, yy, size, size);
          ctx.strokeStyle = 'rgba(201,162,75,0.06)';
          ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx+size, yy+size); ctx.stroke();
        }
      }
    } else if (f.style === 'tile'){
      // chequered saloon tiling with a fine inlaid border
      const size = 34;
      for (let yy = 0; yy < map.height; yy += size){
        for (let xx = 0; xx < map.width; xx += size){
          const alt = ((xx/size | 0) + (yy/size | 0)) % 2 === 0;
          ctx.fillStyle = alt ? f.base : f.plank;
          ctx.fillRect(xx, yy, size, size);
          ctx.strokeStyle = 'rgba(0,0,0,0.10)'; ctx.lineWidth = 1;
          ctx.strokeRect(xx, yy, size, size);
          if (alt){
            ctx.strokeStyle = 'rgba(201,162,75,0.14)';
            ctx.strokeRect(xx+5, yy+5, size-10, size-10);
          }
        }
      }
    } else if (f.style === 'iron'){
      // riveted steel deck plates, offset row to row
      const pw = 96, ph = 52;
      for (let yy = 0; yy < map.height; yy += ph){
        const offset = ((yy/ph | 0) % 2) * (pw/2);
        for (let xx = -pw; xx < map.width + pw; xx += pw){
          const px = xx + offset;
          ctx.fillStyle = ((xx/pw | 0) % 2 === 0) ? f.plank : f.base;
          ctx.fillRect(px, yy, pw, ph);
          ctx.strokeStyle = 'rgba(0,0,0,0.42)'; ctx.lineWidth = 1.4;
          ctx.strokeRect(px, yy, pw, ph);
          ctx.fillStyle = 'rgba(150,140,132,0.32)';
          for (let r = 0; r < 4; r++){
            const rx = px + 9 + r*((pw-18)/3);
            ctx.beginPath(); ctx.arc(rx, yy + 7, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(rx, yy + ph - 7, 1.5, 0, Math.PI*2); ctx.fill();
          }
        }
      }
    } else {
      for (let yy = 0; yy < map.height; yy += 22){
        ctx.fillStyle = ((yy/22 | 0) % 2 === 0) ? f.plank : f.base;
        ctx.fillRect(0, yy, map.width, 22);
        ctx.strokeStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(map.width, yy); ctx.stroke();
      }
    }
  }

  function drawDecor(ctx, map){
    (map.decor || []).forEach(d => {
      if (d.type === 'rug'){
        ctx.fillStyle = d.color;
        ctx.globalAlpha = 0.85;
        ctx.fillRect(d.x, d.y, d.w, d.h);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(201,162,75,0.55)'; ctx.lineWidth = 2;
        ctx.strokeRect(d.x, d.y, d.w, d.h);
        ctx.strokeStyle = 'rgba(201,162,75,0.28)'; ctx.lineWidth = 1;
        ctx.strokeRect(d.x+7, d.y+7, d.w-14, d.h-14);
        ctx.beginPath();
        ctx.ellipse(d.x+d.w/2, d.y+d.h/2, d.w*0.22, d.h*0.22, 0, 0, Math.PI*2);
        ctx.stroke();
      } else if (d.type === 'runner'){
        ctx.fillStyle = 'rgba(107,44,58,0.5)';
        ctx.fillRect(d.x, d.y, d.w, d.h);
        ctx.strokeStyle = 'rgba(201,162,75,0.3)'; ctx.lineWidth = 1;
        ctx.strokeRect(d.x, d.y, d.w, d.h);
      } else if (d.type === 'grate'){
        // an open floor grate looking down onto the stokehold below
        ctx.fillStyle = 'rgba(12,9,8,0.75)';
        ctx.fillRect(d.x, d.y, d.w, d.h);
        ctx.strokeStyle = 'rgba(90,82,76,0.75)'; ctx.lineWidth = 1.6;
        for (let gx = d.x + 6; gx < d.x + d.w; gx += 12){
          ctx.beginPath(); ctx.moveTo(gx, d.y); ctx.lineTo(gx, d.y + d.h); ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(201,162,75,0.45)'; ctx.lineWidth = 2;
        ctx.strokeRect(d.x, d.y, d.w, d.h);
      }
    });
  }

  function drawLights(ctx, map){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    (map.lights || []).forEach(l => {
      const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
      g.addColorStop(0, `rgba(${l.color},${l.alpha})`);
      g.addColorStop(1, `rgba(${l.color},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  function drawWalls(ctx, map, t){
    const w = map.wallThickness;
    ctx.fillStyle = map.wallColor || '#0f2038';
    ctx.fillRect(0, 0, map.width, w);
    ctx.fillRect(0, map.height-w, map.width, w);
    ctx.fillRect(0, 0, w, map.height);
    ctx.fillRect(map.width-w, 0, w, map.height);

    // wainscot panelling picked out in brass
    ctx.strokeStyle = 'rgba(201,162,75,0.32)';
    ctx.lineWidth = 1;
    for (let xx = 10; xx < map.width-10; xx += 44){
      ctx.strokeRect(xx, 5, 34, w-10);
      ctx.strokeRect(xx, map.height-w+5, 34, w-10);
    }
    for (let yy = 10; yy < map.height-10; yy += 44){
      ctx.strokeRect(5, yy, w-10, 34);
      ctx.strokeRect(map.width-w+5, yy, w-10, 34);
    }

    // a picture window onto the sea, if this room has one
    if (map.window){
      const win = map.window;
      const g = ctx.createLinearGradient(0, 0, 0, w);
      g.addColorStop(0, '#3a3f6b');
      g.addColorStop(1, '#7a4a6e');
      ctx.fillStyle = g;
      ctx.fillRect(win.x, 3, win.w, w-6);
      ctx.strokeStyle = 'rgba(201,162,75,0.8)'; ctx.lineWidth = 2;
      ctx.strokeRect(win.x, 3, win.w, w-6);
      ctx.strokeStyle = 'rgba(207,230,222,0.35)'; ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++){
        ctx.beginPath();
        ctx.moveTo(win.x + (win.w/4)*i, 3);
        ctx.lineTo(win.x + (win.w/4)*i, w-3);
        ctx.stroke();
      }
      // a slow swell rolling past outside
      ctx.beginPath();
      ctx.moveTo(win.x, w-8);
      for (let px = 0; px <= win.w; px += 8){
        ctx.lineTo(win.x + px, w - 8 + Math.sin((px/22) + t*0.9)*1.6);
      }
      ctx.stroke();
    }

    // portholes
    (map.portholes || []).forEach(p => {
      const px = p.side === 'left' ? w/2 : map.width - w/2;
      const py = p.at;
      ctx.fillStyle = '#1a3350';
      ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(201,162,75,0.8)'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(207,230,222,0.22)';
      ctx.beginPath(); ctx.arc(px - 2, py - 2, 3, 0, Math.PI*2); ctx.fill();
    });

    ctx.strokeStyle = 'rgba(201,162,75,0.6)';
    ctx.lineWidth = 2;
    ctx.strokeRect(w/2, w/2, map.width-w, map.height-w);
  }

  function drawAtmosphere(ctx, map, t){
    const tod = timeOfDay();
    ctx.save();
    ctx.fillStyle = `rgba(${tod.tint},${tod.alpha})`;
    ctx.fillRect(0, 0, map.width, map.height);

    // dust drifting through the lamplight
    ctx.fillStyle = 'rgba(255,240,210,0.30)';
    dustMotes.forEach(m => {
      const dx = m.x + Math.sin(t*0.35 + m.phase) * m.drift;
      const dy = (m.y + t * m.drift * 0.5) % map.height;
      ctx.beginPath(); ctx.arc(dx, dy, m.r, 0, Math.PI*2); ctx.fill();
    });

    const vg = ctx.createRadialGradient(
      map.width/2, map.height/2, Math.min(map.width, map.height)*0.32,
      map.width/2, map.height/2, Math.max(map.width, map.height)*0.72
    );
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, map.width, map.height);
    ctx.restore();
  }

  function drawScene(){
    if (!mapCanvasEl) return;
    const ctx = mapCanvasEl.getContext('2d');
    if (!ctx) return;
    const map = currentMapDef();
    const t = performance.now()/1000;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, map.width, map.height);

    if (staticLayer){
      ctx.drawImage(staticLayer, 0, 0, map.width, map.height);
    } else {
      drawFloor(ctx, map);
      drawDecor(ctx, map);
      drawLights(ctx, map);
    }

    map.obstacles.forEach(o => drawObstacle(ctx, o, t));
    map.interactables.forEach(it => drawInteractable(ctx, it, it === activeInteractable, t));

    // Depth-sort people so anyone standing lower on screen draws in front.
    const actors = npcRuntime.map(n => ({
      y: n.y, draw: () => drawCharacter(ctx, n.x, n.y, {
        color: n.def.color, facing: n.facing, walkPhase: n.walkPhase,
        isMoving: n.isMoving, hat: n.def.hat, small: n.def.small, crew: n.def.crew
      })
    }));
    actors.push({
      y: player.y, draw: () => drawCharacter(ctx, player.x, player.y, {
        color: PLAYER_COLOR, facing: player.facing, walkPhase: player.walkPhase,
        isMoving: player.isMoving, hat: true, crew: true
      })
    });
    actors.sort((a, b) => a.y - b.y).forEach(a => a.draw());

    // A ring under whoever you're about to talk to, so it's obvious who it is.
    if (activeInteractable && activeInteractable.type === 'npc'){
      const n = activeInteractable.npc;
      ctx.strokeStyle = 'rgba(232,148,79,0.75)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(n.x, n.y + 1, 13, 4.5, 0, 0, Math.PI*2); ctx.stroke();
      ctx.font = '11px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(242,233,216,0.95)';
      ctx.fillText(n.def.name, n.x, n.y - 40);
    }

    drawWalls(ctx, map, t);
    drawAtmosphere(ctx, map, t);
  }

  function gameLoop(ts){
    if (!lastFrameTime) lastFrameTime = ts;
    const dt = Math.min((ts - lastFrameTime) / 1000, 0.05);
    lastFrameTime = ts;
    updatePlayer(dt);
    if (modalOverlay.classList.contains('hidden')) updateNpcs(dt);
    drawScene();
    updateInteractionPrompt();
    requestAnimationFrame(gameLoop);
  }

  // Expanded mode lets the map fill the whole viewport, which matters a lot on
  // a wide screen where the in-column canvas is only a fraction of the width.
  let mapExpanded = false;
  function setMapExpanded(on){
    const panel = document.getElementById('deckPanel');
    const btn = document.getElementById('expandMapBtn');
    if (!panel) return;
    mapExpanded = on;
    panel.classList.toggle('expanded', on);
    document.body.style.overflow = on ? 'hidden' : '';
    if (btn) btn.textContent = on ? '⤡ Close' : '⛶ Expand';
  }
  function toggleMapExpanded(){ setMapExpanded(!mapExpanded); }

  function bindMapInput(){
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (MOVE_KEYS[k]){ heldKeys.add(MOVE_KEYS[k]); e.preventDefault(); }
      else if (k === 'e'){ handleInteract(); e.preventDefault(); }
      else if (k === 'f' && modalOverlay.classList.contains('hidden')){ toggleMapExpanded(); e.preventDefault(); }
      else if (k === 'm'){ toggleMusic(); e.preventDefault(); }
      else if (k === 'escape' && mapExpanded && modalOverlay.classList.contains('hidden')){ setMapExpanded(false); e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (MOVE_KEYS[k]) heldKeys.delete(MOVE_KEYS[k]);
    });
    document.querySelectorAll('.dpad-btn').forEach(btn => {
      const dir = btn.dataset.dir;
      const press = (e) => { e.preventDefault(); heldKeys.add(dir); };
      const release = (e) => { e.preventDefault(); heldKeys.delete(dir); };
      btn.addEventListener('touchstart', press, { passive:false });
      btn.addEventListener('touchend', release);
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
    });
    const touchInteractBtn = document.getElementById('touchInteractBtn');
    if (touchInteractBtn) touchInteractBtn.addEventListener('click', handleInteract);
    const expandBtn = document.getElementById('expandMapBtn');
    if (expandBtn) expandBtn.addEventListener('click', toggleMapExpanded);
  }

  /* ================================ 7c. MUSIC =================================== */
  // Background music loops from an external file sitting next to this HTML
  // (ss-mat-rague-theme.mp3 — swap that file to change the track; nothing else
  // needs editing). Browsers refuse to start audio before the user has
  // interacted with the page, so playback is armed on the first click or
  // keypress. If the file is missing the game just runs silent.

  const MUSIC_VOLUME = 0.35;
  const bgmEl = document.getElementById('bgm');
  let musicReady = false;      // has a user gesture happened yet
  let musicAvailable = true;   // did the file actually load

  function fadeAudioTo(target, ms){
    if (!bgmEl) return;
    const from = bgmEl.volume;
    const start = performance.now();
    function step(now){
      const k = Math.min((now - start) / ms, 1);
      bgmEl.volume = clamp(from + (target - from) * k, 0, 1);
      if (k < 1) requestAnimationFrame(step);
      else if (target === 0) bgmEl.pause();
    }
    requestAnimationFrame(step);
  }

  function tryStartMusic(){
    if (!bgmEl || !musicAvailable || state.musicOn === false) return;
    if (!bgmEl.paused) return;
    bgmEl.volume = 0;
    const p = bgmEl.play();
    if (p && typeof p.catch === 'function'){
      p.then(() => fadeAudioTo(MUSIC_VOLUME, 1400))
       .catch(() => { /* blocked or unplayable — stay silent, toggle still works */ });
    } else {
      fadeAudioTo(MUSIC_VOLUME, 1400);
    }
  }

  function updateMusicButton(){
    const btn = document.getElementById('musicBtn');
    if (!btn) return;
    if (!musicAvailable){
      btn.textContent = '♪ No audio';
      btn.title = 'ss-mat-rague-theme.mp3 was not found next to this file';
      btn.classList.add('muted');
      return;
    }
    const on = state.musicOn !== false;
    btn.textContent = on ? '♪ Music' : '♪ Muted';
    btn.classList.toggle('muted', !on);
    btn.title = on ? "Mute the ship's music (M)" : "Unmute the ship's music (M)";
  }

  function toggleMusic(){
    state.musicOn = state.musicOn === false;
    if (state.musicOn) tryStartMusic();
    else fadeAudioTo(0, 500);
    updateMusicButton();
    saveGame();
  }

  function initMusic(){
    if (!bgmEl) return;
    bgmEl.addEventListener('error', () => { musicAvailable = false; updateMusicButton(); });
    // Arm playback on the first gesture of any kind, then stop listening.
    const arm = () => {
      if (musicReady) return;
      musicReady = true;
      tryStartMusic();
      window.removeEventListener('pointerdown', arm);
      window.removeEventListener('keydown', arm);
    };
    window.addEventListener('pointerdown', arm);
    window.addEventListener('keydown', arm);
    const btn = document.getElementById('musicBtn');
    if (btn) btn.addEventListener('click', toggleMusic);
    updateMusicButton();
  }

  /* ================================ 8. ACTIONS ================================== */

  function doRoom(roomId){
    const room = ROOMS.find(r => r.id === roomId);
    if (!room) return;
    if (state.hours < room.cost.hours){ showToast('Not enough hours left today.'); return; }
    for (const key in room.cost){
      if (key === 'hours') continue;
      if ((state[key]||0) < room.cost[key]){ showToast(room.shortMessage || 'Not enough resources for that.'); return; }
    }
    state.hours -= room.cost.hours;
    for (const key in room.cost){ if (key !== 'hours') state[key] -= room.cost[key]; }
    if (!state.actedToday.includes(room.id)) state.actedToday.push(room.id);

    if (room.id === 'purser'){
      render();
      openPurserRequest();
      return;
    }
    addLog(room.action(), 'event');
    render();
  }

  function openPurserRequest(){
    const req = pickOne(REQUESTS);
    openModal("Purser's Office", `<p>${req.text}</p>`, req.choices.map(c => ({
      label: c.label,
      primary: false,
      onClick: () => {
        applyEffects(c.effects);
        addLog(c.result, 'story');
        closeModal();
        render();
      }
    })));
  }

  function openShipyard(){
    const rows = UPGRADES.map(u => {
      const owned = state.upgrades.includes(u.id);
      const afford = state.gold >= u.cost;
      return `<div class="upgrade-row">
        <div class="upgrade-info">
          <p class="upgrade-name">${u.name}</p>
          <p class="upgrade-desc">${u.desc}</p>
        </div>
        <button class="btn ${owned ? 'ghost' : 'secondary'} upgrade-btn" data-id="${u.id}" ${owned || !afford ? 'disabled' : ''}>
          ${owned ? 'Installed ✓' : `${u.cost}🪙`}
        </button>
      </div>`;
    }).join('');
    openModal('The Shipyard', `<p class="modal-intro">Spend your earnings on lasting improvements to the SS Mat Rague.</p><div class="upgrade-list">${rows}</div>`, [
      { label:'Close', primary:true, onClick: closeModal }
    ]);
    modalBox.querySelectorAll('.upgrade-btn').forEach(btn => {
      btn.addEventListener('click', () => buyUpgrade(btn.dataset.id));
    });
  }

  function openDirectory(){
    const rows = ROOMS.map(r => {
      let affordable = state.hours >= r.cost.hours;
      if (affordable){
        for (const key in r.cost){
          if (key === 'hours') continue;
          if ((state[key]||0) < r.cost[key]){ affordable = false; break; }
        }
      }
      const costParts = [];
      if (r.cost.gold) costParts.push(`${r.cost.gold}🪙`);
      if (r.cost.food) costParts.push(`${r.cost.food}🍞`);
      if (r.cost.fuel) costParts.push(`${r.cost.fuel}⛽`);
      costParts.push(`${r.cost.hours}⏳`);
      return `<div class="upgrade-row">
        <div class="upgrade-info">
          <p class="upgrade-name">${r.icon} ${r.name}</p>
          <p class="upgrade-desc">${r.desc}</p>
        </div>
        <button class="btn secondary directory-btn" data-id="${r.id}" ${affordable ? '' : 'disabled'}>
          ${r.actionLabel}<br><span class="room-cost">${costParts.join(' · ')}</span>
        </button>
      </div>`;
    }).join('');
    openModal("Ship's Directory", `<p class="modal-intro">A click-to-do list of every department, if you'd rather not walk there.</p><div class="upgrade-list">${rows}</div>`, [
      { label:'Close', primary:true, onClick: closeModal }
    ]);
    modalBox.querySelectorAll('.directory-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        doRoom(id);
        if (id !== 'purser') openDirectory(); // refresh in place; purser opens its own request dialog instead
      });
    });
  }

  function buyUpgrade(id){
    const u = UPGRADES.find(x => x.id === id);
    if (!u || state.upgrades.includes(id) || state.gold < u.cost) return;
    state.gold -= u.cost;
    state.upgrades.push(id);
    u.apply();
    addLog(`Shipyard: ${u.name} installed.`, 'system');
    render();
    saveGame();
    openShipyard();
  }

  function confirmNewVoyage(){
    openModal('Start a New Voyage?', `<p>Your current voyage — Day ${state.day}, ${state.gold}g in the ship's account — will be lost for good.</p>`, [
      { label:'Cancel', primary:false, onClick: closeModal },
      { label:'Start New Voyage', primary:true, onClick: () => {
          closeModal();
          const keepMusic = state.musicOn;
          state = defaultState();
          state.musicOn = keepMusic; // a device preference, not voyage progress
          goToMap('mainHall');
          updateMusicButton();
          render();
          saveGame();
          showIntro();
        }
      }
    ]);
  }

  function showGameOver(){
    openModal('The Voyage Ends', `<p>The books don't lie: the SS Mat Rague has run too deep into debt. The Malek Sepai Cruise Line recalls her to port, and your command along with her.</p><p class="modal-hint">Reached Day ${state.day} · Final reputation ${state.reputation.toFixed(1)} ★</p>`, [
      { label:'Start a New Voyage', primary:true, onClick: () => {
          closeModal();
          const keepMusic = state.musicOn;
          state = defaultState();
          state.musicOn = keepMusic; // a device preference, not voyage progress
          goToMap('mainHall');
          updateMusicButton();
          render();
          saveGame();
          showIntro();
        }
      }
    ]);
  }

  function showIntro(){
    openModal("Captain's Log — Day 1", `
      <p>The <strong>SS Mat Rague</strong> sits proud at her berth, brass fittings catching the morning light — pride of the Malek Sepai Cruise Line, finest ship they say to ever leave port.</p>
      <p>Today, she is yours to command.</p>
      <p>Keep the passengers happy. Keep the ship sound. Keep the voyage moving forward — one day, and one decision, at a time.</p>
      <p class="modal-hint">Each day you have a handful of working hours to spend across the ship's departments. Choose wisely, then end the day to see how the voyage unfolds.</p>
    `, [
      { label:'Take the Helm', primary:true, onClick: () => {
          closeModal();
          addLog('The SS Mat Rague casts off. Day 1 begins.', 'system');
          render();
          saveGame();
        }
      }
    ]);
  }

  /* ============================= 9. DAY RESOLUTION =============================== */

  function endDayFlow(){
    if (state.hours > 0){
      openModal('Still Time Left', `<p>You still have <strong>${state.hours}</strong> working hour${state.hours===1?'':'s'} left today. End the day anyway?</p>`, [
        { label:'Keep Working', primary:false, onClick: closeModal },
        { label:'End the Day', primary:true, onClick: () => { closeModal(); performEndDay(); } }
      ]);
    } else {
      performEndDay();
    }
  }

  function performEndDay(){
    const report = resolveDay();
    render();
    saveGame();
    showDayReport(report);
  }

  function resolveDay(){
    const finishedDay = state.day;
    const event = pickEvent();
    const eventResult = EVENT_RESOLVERS[event.id]();
    applyEffects(eventResult.effects);

    const fareIncome = Math.round(state.passengers * 5 * (state.happiness/100));
    const wages = 45;
    state.gold += fareIncome - wages;

    state.happiness = clamp(state.happiness - 4, 0, 100);
    state.shipCondition = clamp(state.shipCondition - 3, 0, 100);

    if (state.happiness >= 80) state.reputation = clamp(state.reputation + 0.05, 0, 5);
    else if (state.happiness < 40) state.reputation = clamp(state.reputation - 0.08, 0, 5);

    state.day += 1;
    state.hours = state.hoursMax;
    state.lookout = 0;
    state.actedToday = [];
    state.npcTalks = {};
    state.food = clamp(state.food + 20, 0, state.foodMax);
    state.fuel = clamp(state.fuel + 20, 0, state.fuelMax);

    let passengerDelta = 0;
    if (state.day % 3 === 0){
      const before = state.passengers;
      state.passengers = clamp(state.passengers + Math.round((state.reputation-3)*2), 10, state.passengersMax);
      passengerDelta = state.passengers - before;
    }

    addLog(eventResult.text, 'event');
    addLog(`Fares collected: +${fareIncome}g · Crew wages: -${wages}g`, 'finance');

    const bankrupt = state.gold < -150;
    if (bankrupt) addLog("The ship's accounts have gone dangerously into the red.", 'warn');

    return { finishedDay, eventText:eventResult.text, fareIncome, wages, passengerDelta, bankrupt };
  }

  function showDayReport(report){
    const net = report.fareIncome - report.wages;
    const extra = report.passengerDelta
      ? `<p class="modal-hint">${report.passengerDelta > 0 ? 'New passengers have booked passage: +' : 'A few passengers have cancelled: '}${report.passengerDelta}.</p>`
      : '';
    openModal(`Captain's Log — Day ${report.finishedDay}`, `
      <p>${report.eventText}</p>
      <div class="report-finance">
        <span>Fares collected</span><span>+${report.fareIncome}g</span>
        <span>Crew wages</span><span>-${report.wages}g</span>
        <span class="report-net">Net for the day</span><span class="report-net">${net>=0?'+':''}${net}g</span>
      </div>
      ${extra}
      ${report.bankrupt ? '' : `<p class="modal-hint">Day ${state.day} begins.</p>`}
    `, [
      { label: report.bankrupt ? 'See the Reckoning' : 'Continue', primary:true, onClick: () => {
          closeModal();
          if (report.bankrupt) showGameOver();
          else checkAndShowStoryBeat();
        }
      }
    ]);
  }

  function checkAndShowStoryBeat(){
    const beat = STORY_BEATS.find(b => b.day === state.day && !state.storyFlags['beat_'+b.id]);
    if (beat){
      state.storyFlags['beat_'+beat.id] = true;
      showStoryBeat(beat);
      saveGame();
    }
  }

  function showStoryBeat(beat){
    const body = beat.bodyFn ? beat.bodyFn() : beat.body;
    if (beat.choices){
      openModal(beat.title, body, beat.choices.map(c => ({
        label:c.label, primary:false,
        onClick:() => { applyEffects(c.effects); addLog(c.result,'story'); closeModal(); render(); saveGame(); }
      })));
    } else {
      openModal(beat.title, body, [{ label:'Continue', primary:true, onClick: closeModal }]);
    }
  }

  /* ================================== 10. INIT =================================== */

  function bindStaticButtons(){
    document.getElementById('directoryBtn').addEventListener('click', openDirectory);
    document.getElementById('shipyardBtn').addEventListener('click', openShipyard);
    document.getElementById('endDayBtn').addEventListener('click', endDayFlow);
    document.getElementById('newVoyageBtn').addEventListener('click', confirmNewVoyage);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modalOverlay.classList.contains('hidden')) closeModal();
    });
  }

  async function init(){
    const loaded = await loadGame();
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    const vTag = document.getElementById('versionTag');
    if (vTag) vTag.textContent = 'Version ' + GAME_VERSION;

    player.map = MAPS[state.currentMap] ? state.currentMap : 'mainHall';
    const spawn = currentMapDef().spawn;
    player.x = spawn.x;
    player.y = spawn.y;
    spawnNpcsForMap(player.map);
    updateMapMeta();

    bindStaticButtons();
    bindMapInput();
    initMusic();
    initHeroAnimations();
    render();
    requestAnimationFrame(gameLoop);
    if (!loaded) showIntro();
    else showToast(`Welcome back, Captain — Day ${state.day}.`);
  }

  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
