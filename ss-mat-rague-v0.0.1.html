<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SS Mat Rague v0.0.1 — Malek Sepai Studio</title>
<style>
  :root{
    --navy-deep:#0b1e38;
    --navy-mid:#132a4a;
    --twilight:#3a3f6b;
    --dusk-rose:#a8567a;
    --amber:#e8944f;
    --brass:#c9a24b;
    --cream:#f2e9d8;
    --danger:#b3503f;
    --good:#5c9c73;
    --warn:#d9a441;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(ellipse at 50% -10%, #16294a 0%, var(--navy-deep) 55%, #060f1e 100%);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .hidden{ display:none !important; }
  #app{ max-width:1560px; margin:0 auto; padding:0 0 40px; }

  /* ---------- Loading ---------- */
  .loading-overlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--navy-deep); z-index:999;
  }
  .loading-inner{ text-align:center; }
  .loading-ship{ font-size:42px; animation:bob 1.6s ease-in-out infinite; display:inline-block; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
  .loading-inner p{ margin-top:10px; opacity:.7; letter-spacing:.05em; font-size:13px; }

  /* ---------- Hero ---------- */
  .hero{ position:relative; }
  .hero svg{ display:block; width:100%; height:auto; max-height:300px; }
  .hero-overlay{
    position:absolute; top:6%; left:5%; max-width:70%;
    background:linear-gradient(160deg, rgba(6,14,28,.62), rgba(6,14,28,0) 82%);
    padding:18px 22px 26px; border-radius:0 0 20px 0;
  }
  .eyebrow{ margin:0 0 4px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--brass); opacity:.95; }
  .ship-name{
    margin:0; font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;
    font-size:clamp(26px,5vw,46px); letter-spacing:.03em; text-transform:uppercase; color:var(--cream);
    text-shadow:0 1px 0 rgba(0,0,0,.4), 0 0 22px rgba(201,162,75,.35);
  }
  .tagline{ margin:6px 0 0; font-style:italic; color:var(--cream); opacity:.82; font-size:13.5px; }
  .version-tag{ margin:6px 0 0; font-size:10px; letter-spacing:.14em; text-transform:uppercase; opacity:.45; }
  .corner-btns{ position:absolute; top:14px; right:14px; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .ghost-btn.muted{ opacity:.5; text-decoration:line-through; }

  /* ---------- Promenade deck ---------- */
  .promenade{ position:relative; margin:14px 20px 0; border-radius:14px; overflow:hidden; border:1px solid rgba(201,162,75,.25); }
  .promenade svg{ display:block; width:100%; height:auto; max-height:150px; }
  .promenade-caption{
    position:absolute; bottom:8px; left:10px; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    opacity:.75; background:rgba(6,14,28,.55); padding:3px 9px; border-radius:20px; color:var(--cream);
  }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:inherit; font-size:14px; font-weight:600; padding:10px 16px; border-radius:9px;
    border:1px solid transparent; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:focus-visible, .room-btn:focus-visible, .ghost-btn:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  .btn.primary{ background:var(--amber); color:#241606; border-color:#b96f31; }
  .btn.primary:hover{ transform:translateY(-2px); box-shadow:0 6px 16px rgba(232,148,79,.35); }
  .btn.secondary{ background:transparent; color:var(--cream); border-color:rgba(242,233,216,.35); }
  .btn.secondary:hover{ background:rgba(242,233,216,.08); transform:translateY(-2px); }
  .btn.ghost{ background:transparent; color:rgba(242,233,216,.5); border-color:rgba(242,233,216,.15); cursor:default; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none !important; box-shadow:none !important; }
  .ghost-btn{
    background:rgba(11,30,56,.55); color:var(--cream); border:1px solid rgba(201,162,75,.4);
    border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .ghost-btn:hover{ background:rgba(11,30,56,.85); }

  /* ---------- Status strips ---------- */
  .status-strip, .resource-strip{ display:flex; flex-wrap:wrap; gap:10px; padding:16px 20px 0; }
  .resource-strip{ padding-top:8px; }
  .stat-pill{
    background:rgba(19,42,74,.6); border:1px solid rgba(201,162,75,.25); border-radius:10px;
    padding:8px 14px; display:flex; align-items:center; gap:8px; font-size:13px;
  }
  .stat-pill .label{ text-transform:uppercase; letter-spacing:.08em; font-size:10px; opacity:.6; }
  .stat-pill .value{ font-weight:700; }
  .pips .pip-empty{ opacity:.25; filter:grayscale(1); }
  .stars{ display:inline-flex; gap:1px; }
  .star-slot{ position:relative; display:inline-block; width:14px; }
  .star-base{ color:rgba(242,233,216,.22); }
  .star-fill{ position:absolute; top:0; left:0; overflow:hidden; white-space:nowrap; color:var(--brass); }

  .resource-bar{
    display:flex; align-items:center; gap:8px; background:rgba(19,42,74,.5);
    border:1px solid rgba(201,162,75,.18); border-radius:10px; padding:7px 12px; font-size:12px; flex:1 1 190px;
  }
  .resource-bar .rb-label{ width:64px; opacity:.75; }
  .rb-track{ flex:1; height:6px; background:rgba(255,255,255,.08); border-radius:4px; overflow:hidden; }
  .rb-fill{ height:100%; background:var(--brass); border-radius:4px; }
  .resource-bar.mid .rb-fill{ background:var(--warn); }
  .resource-bar.low .rb-fill{ background:var(--danger); }
  .rb-value{ width:46px; text-align:right; opacity:.8; font-variant-numeric:tabular-nums; }

  /* ---------- Main grid ---------- */
  .main-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,360px); gap:18px; padding:18px 20px 0; align-items:start; }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border-bottom:1px solid rgba(201,162,75,.25); padding-bottom:8px; margin-bottom:10px;
  }
  .panel-title.bare{ border-bottom:none; padding-bottom:0; margin:0; }
  .panel-title{
    font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;
    letter-spacing:.04em; text-transform:uppercase; font-size:15px; color:var(--brass); margin:0 0 10px;
    border-bottom:1px solid rgba(201,162,75,.25); padding-bottom:8px;
  }
  .room-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .room-card{
    background:linear-gradient(160deg, rgba(19,42,74,.75), rgba(11,30,56,.75));
    border:1px solid rgba(201,162,75,.3); border-radius:12px; padding:14px; text-align:center;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .room-card:not(.disabled):hover{ transform:translateY(-4px); box-shadow:0 10px 22px rgba(0,0,0,.35); border-color:var(--brass); }
  .room-card.disabled{ opacity:.45; }
  .room-icon{ font-size:30px; }
  .room-name{ font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif; margin:6px 0 4px; font-size:15px; letter-spacing:.02em; }
  .room-desc{ font-size:11.5px; opacity:.65; margin:0 0 10px; line-height:1.4; min-height:32px; }
  .room-btn{
    width:100%; background:rgba(201,162,75,.14); border:1px solid rgba(201,162,75,.5); color:var(--cream);
    border-radius:8px; padding:8px 10px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; gap:2px; transition:background .15s ease;
  }
  .room-btn:hover:not(:disabled){ background:rgba(201,162,75,.28); }
  .room-btn:disabled{ cursor:not-allowed; opacity:.5; }
  .room-cost{ font-size:10.5px; opacity:.7; font-weight:400; }

  .map-hint{ margin:-4px 0 10px; font-size:11.5px; opacity:.55; letter-spacing:.03em; }
  .explore-frame{
    position:relative; border:1px solid rgba(201,162,75,.3); border-radius:12px; overflow:hidden;
    background:#0f2038; line-height:0;
  }
  #mapCanvas{ display:block; width:100%; height:auto; cursor:default; }
  .interact-prompt{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    background:rgba(6,14,28,.78); border:1px solid rgba(201,162,75,.5); color:var(--cream);
    padding:6px 14px; border-radius:20px; font-size:12.5px; font-weight:600; white-space:nowrap;
    pointer-events:none;
  }
  .touch-controls{
    position:absolute; left:0; right:0; bottom:12px; display:flex; align-items:flex-end;
    justify-content:space-between; padding:0 14px; pointer-events:none;
  }
  .dpad{
    display:grid; grid-template-columns:repeat(3,34px); grid-template-rows:repeat(3,34px);
    gap:2px; pointer-events:auto;
  }
  .dpad-btn{
    grid-column:2; background:rgba(11,30,56,.72); border:1px solid rgba(201,162,75,.5); color:var(--cream);
    border-radius:8px; font-size:14px; cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .dpad-btn[data-dir="up"]{ grid-row:1; }
  .dpad-btn[data-dir="left"]{ grid-row:2; grid-column:1; }
  .dpad-btn[data-dir="down"]{ grid-row:2; }
  .dpad-btn[data-dir="right"]{ grid-row:2; grid-column:3; }
  .dpad-btn:active{ background:rgba(201,162,75,.35); }
  .interact-btn{
    pointer-events:auto; width:52px; height:52px; border-radius:50%; background:var(--amber);
    color:#241606; border:1px solid #b96f31; font-weight:700; font-size:16px; cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.35); user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .interact-btn:active{ transform:scale(.94); }

  /* On a mouse/trackpad machine the D-pad is just clutter over the scene — WASD
     is right there. Only show it where touch is the primary input. */
  @media (hover:hover) and (pointer:fine){
    .touch-controls{ display:none; }
  }

  /* Expanded ("⛶") mode: the deck panel takes over the whole viewport so the
     map can be as large as the screen allows. */
  .deck-panel.expanded{
    position:fixed; inset:0; z-index:900; margin:0; padding:10px 12px 14px;
    background:radial-gradient(ellipse at 50% 0%, #16294a 0%, #0b1e38 60%, #060f1e 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:auto;
  }
  .deck-panel.expanded .panel-head{ width:100%; max-width:1100px; }
  .deck-panel.expanded .map-hint{ width:100%; max-width:1100px; }
  .deck-panel.expanded .explore-frame{ max-width:100%; }
  .deck-panel.expanded #mapCanvas{
    width:auto; height:calc(100vh - 132px);
    max-width:calc(100vw - 34px); max-height:calc(100vh - 132px);
  }

  .log-panel{ background:rgba(11,30,56,.4); border:1px solid rgba(201,162,75,.2); border-radius:12px; padding:14px; max-height:520px; overflow-y:auto; }
  .log-entries{ display:flex; flex-direction:column; gap:10px; }
  .log-entry{ border-left:3px solid var(--brass); padding:2px 0 2px 10px; }
  .log-entry p{ margin:2px 0 0; font-size:13px; line-height:1.45; opacity:.9; }
  .log-entry .log-day{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; opacity:.5; }
  .log-entry.story{ border-left-color:var(--dusk-rose); }
  .log-entry.finance{ border-left-color:var(--good); }
  .log-entry.system{ border-left-color:var(--twilight); }
  .log-entry.warn{ border-left-color:var(--danger); }
  .log-empty{ opacity:.5; font-size:13px; font-style:italic; }
  .log-panel::-webkit-scrollbar{ width:6px; }
  .log-panel::-webkit-scrollbar-thumb{ background:rgba(201,162,75,.4); border-radius:3px; }

  /* ---------- Action bar ---------- */
  .action-bar{ display:flex; justify-content:center; gap:14px; padding:26px 20px 6px; }
  .save-indicator{ text-align:center; font-size:11px; opacity:0; letter-spacing:.06em; color:var(--good); transition:opacity .3s ease; height:14px; margin:2px 0 0; }
  .save-indicator.show{ opacity:.85; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(4,10,20,.72); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;
  }
  .modal-box{
    background:linear-gradient(165deg, #1a2c4d, #0f2038); border:1px solid rgba(201,162,75,.4);
    border-radius:16px; padding:26px 28px; max-width:480px; width:100%; max-height:85vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-title{ font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif; letter-spacing:.03em; margin:0 0 12px; font-size:21px; color:var(--brass); }
  .modal-body p{ line-height:1.6; font-size:14.5px; margin:0 0 10px; opacity:.92; }
  .modal-body strong{ color:var(--amber); }
  .modal-hint{ font-size:12.5px !important; opacity:.6 !important; font-style:italic; }
  .modal-intro{ opacity:.75; font-size:13.5px !important; }
  .modal-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; justify-content:flex-end; }

  .report-finance{ display:grid; grid-template-columns:1fr auto; gap:5px 14px; font-size:13.5px; margin:14px 0; padding:12px 14px; background:rgba(0,0,0,.18); border-radius:10px; }
  .report-net{ font-weight:700; border-top:1px solid rgba(242,233,216,.15); padding-top:6px; margin-top:2px; color:var(--amber); }

  .upgrade-list{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .upgrade-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; background:rgba(0,0,0,.18); border-radius:10px; padding:10px 14px; }
  .upgrade-name{ margin:0; font-weight:700; font-size:13.5px; }
  .upgrade-desc{ margin:2px 0 0; font-size:11.5px; opacity:.65; }
  .upgrade-btn{ flex-shrink:0; white-space:nowrap; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--brass); color:#241606; padding:10px 18px; border-radius:30px;
    font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:1100;
  }

  /* ---------- Responsive ---------- */
  @media (max-width:780px){
    .main-grid{ grid-template-columns:1fr; }
    .log-panel{ max-height:320px; }
    .hero-overlay{ max-width:88%; }
  }
  @media (max-width:480px){
    .status-strip, .resource-strip, .main-grid, .action-bar{ padding-left:12px; padding-right:12px; }
    .promenade{ margin-left:12px; margin-right:12px; }
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important; scroll-behavior:auto !important;
    }
  }
</style>
</head>
<body>

  <div id="loading" class="loading-overlay">
    <div class="loading-inner">
      <div class="loading-ship">🚢</div>
      <p>Casting off…</p>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="hero">
      <svg viewBox="0 0 900 260" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The SS Mat Rague sailing at dusk">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0b1e38"/>
            <stop offset="32%" stop-color="#233763"/>
            <stop offset="62%" stop-color="#7a4a6e"/>
            <stop offset="83%" stop-color="#c97a53"/>
            <stop offset="100%" stop-color="#e8b165"/>
          </linearGradient>
          <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2a4a55"/>
            <stop offset="100%" stop-color="#0b1a22"/>
          </linearGradient>
        </defs>

        <rect x="0" y="0" width="900" height="190" fill="url(#skyGrad)"/>

        <g class="stars-group" fill="#f6ecd6">
          <circle class="star" cx="40" cy="26" r="1.4"/>
          <circle class="star" cx="95" cy="60" r="1"/>
          <circle class="star" cx="150" cy="16" r="1.3"/>
          <circle class="star" cx="205" cy="70" r="1"/>
          <circle class="star" cx="260" cy="32" r="1.5"/>
          <circle class="star" cx="320" cy="52" r="1"/>
          <circle class="star" cx="120" cy="95" r="1.1"/>
          <circle class="star" cx="700" cy="70" r="1.2"/>
          <circle class="star" cx="750" cy="32" r="1"/>
          <circle class="star" cx="810" cy="55" r="1.4"/>
          <circle class="star" cx="860" cy="22" r="1"/>
          <circle class="star" cx="640" cy="90" r="1.1"/>
        </g>

        <path class="gull" d="M140,50 q6,-7 12,0 q6,-7 12,0" fill="none" stroke="#f2e9d8" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
        <path class="gull" d="M760,40 q5,-6 10,0 q5,-6 10,0" fill="none" stroke="#f2e9d8" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
        <path class="gull" d="M700,88 q4,-5 8,0 q4,-5 8,0" fill="none" stroke="#f2e9d8" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>

        <rect x="0" y="184" width="900" height="76" fill="url(#seaGrad)"/>
        <path class="wave" d="M0,196 Q30,190 60,196 T120,196 T180,196 T240,196 T300,196 T360,196 T420,196 T480,196 T540,196 T600,196 T660,196 T720,196 T780,196 T840,196 T900,196" fill="none" stroke="#cfe6de" stroke-opacity="0.22" stroke-width="1.4"/>
        <path class="wave" d="M0,208 Q30,203 60,208 T120,208 T180,208 T240,208 T300,208 T360,208 T420,208 T480,208 T540,208 T600,208 T660,208 T720,208 T780,208 T840,208 T900,208" fill="none" stroke="#cfe6de" stroke-opacity="0.16" stroke-width="1.4"/>
        <path class="wave" d="M0,222 Q30,217 60,222 T120,222 T180,222 T240,222 T300,222 T360,222 T420,222 T480,222 T540,222 T600,222 T660,222 T720,222 T780,222 T840,222 T900,222" fill="none" stroke="#cfe6de" stroke-opacity="0.12" stroke-width="1.4"/>

        <g id="shipGroup">
          <polygon points="322,178 615,178 636,184 630,198 322,198 304,190 310,180" fill="#182338" stroke="#c9a24b" stroke-width="2" stroke-linejoin="round"/>
          <rect x="345" y="140" width="250" height="38" rx="3" fill="#e9dcc0" stroke="#8a6f2f" stroke-width="1.4"/>
          <rect x="400" y="116" width="120" height="26" rx="3" fill="#e9dcc0" stroke="#8a6f2f" stroke-width="1.4"/>

          <circle cx="360" cy="159" r="3.4" fill="#ffd77a" stroke="#3a2c1c" stroke-width="1"/>
          <circle cx="386" cy="159" r="3.4" fill="#ffd77a" stroke="#3a2c1c" stroke-width="1"/>

          <circle cx="578" cy="159" r="3.4" fill="#ffd77a" stroke="#3a2c1c" stroke-width="1"/>

          <rect x="430" y="72" width="20" height="46" rx="5" fill="#7a2e2e" stroke="#2a1010" stroke-width="1.2"/>
          <rect x="430" y="72" width="20" height="9" fill="#181010"/>
          <rect x="468" y="72" width="20" height="46" rx="5" fill="#7a2e2e" stroke="#2a1010" stroke-width="1.2"/>
          <rect x="468" y="72" width="20" height="9" fill="#181010"/>

          <line x1="600" y1="116" x2="600" y2="92" stroke="#c9a24b" stroke-width="2"/>
          <path d="M600,94 L618,99 L600,104 Z" fill="#e8944f"/>

          <g class="smoke">
            <ellipse cx="440" cy="64" rx="6" ry="4" fill="#dfe4e8" opacity="0.5"/>
            <ellipse cx="444" cy="50" rx="8" ry="5" fill="#dfe4e8" opacity="0.35"/>
            <ellipse cx="449" cy="34" rx="10" ry="6" fill="#dfe4e8" opacity="0.2"/>
          </g>
          <g class="smoke">
            <ellipse cx="478" cy="64" rx="6" ry="4" fill="#dfe4e8" opacity="0.5"/>
            <ellipse cx="482" cy="50" rx="8" ry="5" fill="#dfe4e8" opacity="0.35"/>
            <ellipse cx="487" cy="34" rx="10" ry="6" fill="#dfe4e8" opacity="0.2"/>
          </g>
        </g>
      </svg>

      <div class="hero-overlay">
        <p class="eyebrow">Malek Sepai Cruise Line presents</p>
        <h1 class="ship-name">SS Mat Rague</h1>
        <p class="tagline">Keep her steady. Keep them smiling.</p>
        <p class="version-tag" id="versionTag"></p>
      </div>
      <div class="corner-btns">
        <button id="musicBtn" class="ghost-btn" title="Toggle the ship's music (M)">♪ Music</button>
        <button id="newVoyageBtn" class="ghost-btn" title="Start a new voyage">⟲ New Voyage</button>
      </div>
    </header>

    <audio id="bgm" loop preload="auto">

    <section class="promenade">

    <main class="main-grid">

    <footer class="action-bar">
      <button id="directoryBtn" class="btn secondary">📋 Ship's Directory</button>
      <button id="shipyardBtn" class="btn secondary">⚓ Visit the Shipyard</button>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div id="modalBox" class="modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
  <script>
  /* ==========================================================================
     SS MAT RAGUE — a cruise-ship management sim
     Malek Sepai Studio

     HOW THIS FILE IS ORGANISED (search for these header comments):
       1. CONTENT DATA   — rooms, passenger requests, events, story beats, upgrades.
                            This is almost certainly where you'll add new content.
       2. STATE           — the shape of a save file, and the live `state` object.
       3. STORAGE          — load/save using window.storage (persists between visits).
       4. UTILITIES        — small helpers used everywhere.
       5. RENDERING        — turns `state` into HTML, including the animated
                            promenade-deck passenger/crew figures.
       6. MODAL SYSTEM     — one reusable popup used for every dialog in the game.
       7. ANIMATION        — GSAP flourishes, gated so the game still works without them.
      7b. EXPLORATION      — the walkable maps: MAPS data, WASD/E input, collision,
                            and the canvas draw loop. Add new maps here.
      7c. MUSIC            — the looping background track and its mute toggle.
       8. ACTIONS          — what happens when the player interacts with things
                            (walking up + E, the Ship's Directory, or the footer buttons).
       9. DAY RESOLUTION   — what happens when a day ends.
      10. INIT             — boots the game on page load.

     To add a new room, event, story beat, passenger request, or shipyard
     upgrade: find the matching array in section 1 and add one more entry in
     the same shape as its neighbours. Nothing else needs to change.
  ========================================================================== */

  /* ============================= 1. CONTENT DATA ============================= */

  const BRIDGE_LINES = [
    'Officer Rahim squints through the brass telescope. "Clear water ahead, Captain."',
    'You trace the shipping lanes across the chart table, plotting a careful course.',
    'The quartermaster keeps both hands steady on the wheel. "Steady as she goes, sir."'
  ];
  const ENGINE_LINES = [
    "The stokers heave coal into the furnace. The deck hums beneath the great engines' heartbeat.",
    'Chief Engineer Tan wipes soot from his brow and grins. "She\'s running beautifully, Captain."',
    'Steam hisses through the pipes as the boilers roar back up to speed.'
  ];
  const GALLEY_LINES = [
    'The scent of warm bread and roasted spice drifts through the corridors.',
    'Cook Yusuf sends out trays of his famous curry. Passengers line up eagerly.',
    'Silver trays clink in the dining hall as the evening service begins.'
  ];
  const DECK_LINES = [
    'Brass fittings gleam as the crew polishes every railing to a shine.',
    'Fresh linens, swept decks, and the smell of varnish — she looks her very best.',
    'A crew member hums a tune while scrubbing the promenade deck spotless.'
  ];
  const LOUNGE_LINES = [
    'A string trio strikes up in the Grand Lounge. Laughter spills onto the promenade.',
    'Dancers twirl beneath the chandeliers as the band plays late into the night.',
    'Passengers gather for cards and stories, the lounge warm with candlelight.'
  ];

  // Each room needs: id, name, icon, desc, actionLabel, cost (an object with
  // "hours" plus optionally gold/food/fuel), a shortMessage for when the
  // player can't afford it, and an action() that mutates `state` and returns
  // a line of log text. The Purser's Office is the one exception — its
  // action is handled specially in doRoom() because it opens a passenger
  // request instead.
  const ROOMS = [
    {
      id:'bridge', name:'The Bridge', icon:'🧭',
      desc:'Chart a safe course and keep watch for hazards.',
      actionLabel:'Chart the Course',
      cost:{ hours:1 },
      shortMessage:'Not enough hours left today.',
      action:() => {
        state.lookout += 1;
        state.reputation = clamp(state.reputation+0.05,0,5);
        return pickOne(BRIDGE_LINES);
      }
    },
    {
      id:'engine', name:'The Engine Room', icon:'⚙️',
      desc:'Stoke the boilers to keep the ship running true.',
      actionLabel:'Stoke the Boilers',
      cost:{ hours:1, fuel:8 },
      shortMessage:'Not enough coal in the bunkers.',
      action:() => {
        state.reputation = clamp(state.reputation+0.06,0,5);
        return pickOne(ENGINE_LINES);
      }
    },
    {
      id:'galley', name:'The Galley', icon:'🍽️',
      desc:'Prepare a proper meal for the passengers.',
      actionLabel:'Prepare a Feast',
      cost:{ hours:1, food:10 },
      shortMessage:'Not enough provisions in the galley.',
      action:() => {
        state.happiness = clamp(state.happiness+7,0,100);
        return pickOne(GALLEY_LINES);
      }
    },
    {
      id:'deck', name:'Deck & Cabins', icon:'🧹',
      desc:'Polish, sweep, and mend — keep her looking her best.',
      actionLabel:'Polish & Repair',
      cost:{ hours:1 },
      shortMessage:'Not enough hours left today.',
      action:() => {
        state.shipCondition = clamp(state.shipCondition+9,0,100);
        state.happiness = clamp(state.happiness+2,0,100);
        return pickOne(DECK_LINES);
      }
    },
    {
      id:'lounge', name:'The Grand Lounge', icon:'🎻',
      desc:'Host music and merriment for the evening.',
      actionLabel:'Host an Evening',
      cost:{ hours:1, gold:12 },
      shortMessage:"Not enough gold for tonight's entertainment.",
      action:() => {
        const bonus = state.upgrades.includes('orchestra') ? 4 : 0;
        state.happiness = clamp(state.happiness+9+bonus,0,100);
        state.reputation = clamp(state.reputation+0.08,0,5);
        return pickOne(LOUNGE_LINES);
      }
    },
    {
      id:'purser', name:"Purser's Office", icon:'🎟️',
      desc:"Hear out a passenger's request in person.",
      actionLabel:'Greet Passengers',
      cost:{ hours:1 },
      shortMessage:'Not enough hours left today.',
      action:null
    }
    // --- Add a new room here: give it a unique id, icon, cost, and an
    //     action() that mutates `state` and returns a line of flavour text. ---
  ];

  // Passenger requests: the Purser's Office opens one of these at random.
  // Each choice has its own effects and its own follow-up line.
  const REQUESTS = [
    {
      id:'hat',
      text: "Mrs. Halim can't find her favourite hat anywhere on B-Deck, and she's nearly in tears about it.",
      choices:[
        { label:'Send the crew to search', effects:{ happiness:5 }, result:'The crew turns the deck over and finds it wedged behind a chair. Mrs. Halim beams.' },
        { label:"Replace it from the ship's boutique (15g)", effects:{ happiness:8, gold:-15 }, result:'A new hat, even finer than the last, is delivered to her cabin within the hour.' }
      ]
    },
    {
      id:'seasick',
      text: 'A young boy named Faris is too seasick to join his family for dinner, and looks miserable about missing it.',
      choices:[
        { label:"Send the ship's doctor", effects:{ happiness:4 }, result:"The doctor settles him with a kind word and a steady hand. He's smiling within the hour." },
        { label:'Have the galley prepare a tray (6 food)', effects:{ happiness:7, food:-6 }, result:'A special tray arrives at his cabin door. His mother thanks you personally the next morning.' }
      ]
    },
    {
      id:'anniversary',
      text: 'An elderly couple, married forty years, mention quietly that this voyage is their anniversary gift to each other.',
      choices:[
        { label:'Arrange a private table by the window (10g)', effects:{ happiness:6, gold:-10, reputation:0.1 }, result:"Candlelight, the sea outside the glass, and forty years between them. They don't stop smiling all evening." },
        { label:'Simply wish them well', effects:{ happiness:3 }, result:"They don't need anything grand — just each other, and the sea." }
      ]
    },
    {
      id:'curious',
      text: 'A young passenger asks whether the SS Mat Rague could really cross the whole ocean without any trouble. You find yourself pausing before you answer.',
      choices:[
        { label:'Reassure her with confidence', effects:{ happiness:4 }, result:'She skips off, satisfied, to tell her friends the captain himself said so.' },
        { label:'Tell her the truth, gently', effects:{ happiness:3, reputation:0.1 }, result:'"The sea always has surprises," you say, "but a good crew is ready for anything." She seems to trust the ship more for the honesty.' }
      ]
    }
    // --- Add a new passenger request here: { id, text, choices:[{label,effects,result}, {label,effects,result}] } ---
  ];

  // Random daily events. pickEvent() builds a weighted list from whichever
  // candidates currently qualify, then EVENT_RESOLVERS[id]() produces the
  // actual text and effects (some branch on state, like storm/iceberg safety).
  function pickEvent(){
    const candidates = [
      { id:'calm', weight:26 },
      { id:'breeze', weight:20 }
    ];
    if (state.day >= 2) candidates.push({ id:'storm', weight:16 });
    if (state.day >= 4) candidates.push({ id:'iceberg', weight:9 });
    if (state.reputation >= 4) candidates.push({ id:'press', weight:10 });
    if (!state.actedToday.includes('engine') && state.fuel < 25) candidates.push({ id:'hiccup', weight:10 });

    const total = candidates.reduce((s,c) => s+c.weight, 0);
    let r = Math.random()*total;
    for (const c of candidates){
      if (r < c.weight) return c;
      r -= c.weight;
    }
    return candidates[0];
  }

  const EVENT_RESOLVERS = {
    calm: () => ({
      text: pickOne([
        'The sea lies flat as glass tonight. Passengers linger on deck to watch the stars come out.',
        'A quiet day at sea. The SS Mat Rague cuts smoothly through calm water.',
        "Nothing much happens today — and after a voyage like this one, that's a small mercy."
      ]),
      effects:{}
    }),
    breeze: () => ({
      text: pickOne([
        "A gentle breeze carries salt air across the deck. It's a fine night for the voyage.",
        'Sunlight and sea spray — passengers spend the afternoon leaning on the rail, watching the water.'
      ]),
      effects:{ happiness:2 }
    }),
    storm: () => {
      if (state.lookout >= 2){
        return {
          text: 'Storm clouds roll in, but the bridge crew already changed course hours ago. You ride out a little rain and nothing more.',
          effects:{ shipCondition:-3 }
        };
      }
      return {
        text: 'A storm catches the SS Mat Rague unprepared. Waves crash over the bow through the night.',
        effects:{ shipCondition:-12, happiness:-6 }
      };
    },
    iceberg: () => {
      const safe = state.lookout >= 2 || state.upgrades.includes('reinforcedHull');
      if (safe){
        return {
          text: '"Ice ahead!" the lookout calls. The wheel spins hard to port, and the SS Mat Rague slips past with yards to spare. On deck, someone lets out a nervous laugh.',
          effects:{ reputation:0.15 }
        };
      }
      return {
        text: "A low grinding shudders through the hull as ice scrapes along the SS Mat Rague's side. A glancing blow — but repairs won't come cheap.",
        effects:{ shipCondition:-14, gold:-60 }
      };
    },
    press: () => ({
      text: 'A travel journalist aboard writes glowingly of the voyage for the papers back home. Bookings for next season tick upward.',
      effects:{ gold:80 }
    }),
    hiccup: () => ({
      text: 'The engines cough and sputter in the night. Chief Tan promises to keep a closer eye on the boilers tomorrow.',
      effects:{ fuel:-5, shipCondition:-2 }
    })
    // --- Add a new event: 1) add a weighted candidate in pickEvent(), 2) add a matching resolver function here. ---
  };

  // Story beats fire once, on a specific day. Use `body` for static HTML, or
  // `bodyFn` for text that depends on state. Leave `choices` null for a
  // beat that just needs a "Continue" button.
  const STORY_BEATS = [
    {
      id:'quietPassenger', day:3, title:'A Quiet Request',
      body: `<p>A passenger travelling alone asks for a moment of your time before dinner. She doesn't say why — only that she'd like to see the bridge, "just once, before we reach the other side."</p>`,
      choices:[
        { label:'Grant her a few minutes on the bridge', effects:{ happiness:6 }, result:'She watches the horizon a long while, then thanks you and returns to her cabin — quieter, but somehow lighter.' },
        { label:'Explain the bridge is crew-only', effects:{ reputation:0.05 }, result:'She nods, understanding. But something in her expression stays with you the rest of the day.' }
      ]
    },
    {
      id:'weekOne', day:7, title:'One Week at Sea',
      bodyFn: () => state.reputation >= 3.5
        ? '<p>A full week aboard, and the SS Mat Rague hums with good spirits. Word has it passengers are already writing home about the voyage.</p>'
        : "<p>A full week aboard, and a few tired grumbles have started reaching your ears. There's still time to turn things around.</p>",
      choices:null
    },
    {
      id:'halfwayGala', day:14, title:'The Halfway Gala',
      body: `<p>The crew requests permission to host a Halfway Gala — a proper celebration for two weeks well sailed.</p>`,
      choices:[
        { label:'Approve it in full (60g)', effects:{ gold:-60, happiness:15, reputation:0.2 }, result:'Streamers, music, and laughter fill the Grand Lounge long past midnight.' },
        { label:'Keep it modest (20g)', effects:{ gold:-20, happiness:7 }, result:'A quieter toast is raised on deck. Simple, but sincere.' }
      ]
    }
    // --- Add a new story beat here: { id, day, title, body (or bodyFn), choices (or null) } ---
    // Example for Day 21: { id:'threeWeeks', day:21, title:'Three Weeks Out', body:'<p>...</p>', choices:null }
  ];

  // Shipyard upgrades. apply() runs once, immediately, on purchase.
  const UPGRADES = [
    { id:'reinforcedHull', name:'Reinforced Hull Plating', cost:300, desc:'Strengthens the hull against storms and ice — hazard damage is cut significantly.', apply:() => { state.shipCondition = clamp(state.shipCondition+5,0,100); } },
    { id:'lifeboats', name:'Extra Lifeboats', cost:200, desc:"A comforting sight for nervous passengers, and required by the harbourmaster's new safety code.", apply:() => { state.reputation = clamp(state.reputation+0.3,0,5); } },
    { id:'pantry', name:'Bigger Pantry', cost:150, desc:'Expands cold storage, so the galley never runs thin.', apply:() => { state.foodMax += 40; state.food = clamp(state.food+40,0,state.foodMax); } },
    { id:'bunkers', name:'Expanded Coal Bunkers', cost:150, desc:'More room to stock fuel between ports.', apply:() => { state.fuelMax += 40; state.fuel = clamp(state.fuel+40,0,state.fuelMax); } },
    { id:'orchestra', name:'Hire a Larger Ensemble', cost:250, desc:'A fuller sound for the Grand Lounge — evenings feel grander.', apply:() => {} },
    { id:'cabins', name:'B-Deck Cabin Expansion', cost:400, desc:'More berths means more passengers — and more fares.', apply:() => { state.passengersMax += 15; } }
    // --- Add a new upgrade here: { id, name, cost, desc, apply() } ---
  ];

  /* ================================ 2. STATE ================================= */

  function defaultState(){
    return {
      day:1,
      gold:500,
      reputation:3.0,
      hours:4, hoursMax:4,
      shipCondition:82,
      food:55, foodMax:100,
      fuel:55, fuelMax:100,
      happiness:68,
      passengers:42, passengersMax:55,
      lookout:0,
      upgrades:[],
      storyFlags:{},
      actedToday:[],
      log:[],
      currentMap:'mainHall',
      npcTalks:{},     // who you've already spoken with today (cleared each morning)
      friendship:{},   // running tally per person, kept for the whole voyage
      musicOn:true
    };
  }

  let state = defaultState();
  // Bump this on every release, and keep it matching the filename
  // (ss-mat-rague-v0.0.1.html). It is stamped into the page title, shown under
  // the ship's name on the banner, and written into each save file.
  const GAME_VERSION = '0.0.1';

  const SAVE_KEY = 'ss_mat_rague_save_v1';

  /* =============================== 3. STORAGE ================================ */

  async function loadGame(){
    try{
      const res = await window.storage.get(SAVE_KEY);
      if (res && res.value){
        state = Object.assign(defaultState(), JSON.parse(res.value));
        return true;
      }
      return false;
    }catch(e){
      return false; // no save yet, or storage unavailable — start fresh
    }
  }

  async function saveGame(){
    try{
      state.version = GAME_VERSION;
      await window.storage.set(SAVE_KEY, JSON.stringify(state), false);
      flashSaveIndicator();
    }catch(e){
      console.error('SS Mat Rague: save failed', e);
    }
  }

  /* ============================== 4. UTILITIES ================================ */

  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function addLog(text, type){
    state.log.push({ day:state.day, text, type: type || 'event' });
    if (state.log.length > 200) state.log.shift();
  }

  function applyEffects(effects){
    if (!effects) return;
    if (effects.gold) state.gold += effects.gold;
    if (effects.happiness) state.happiness = clamp(state.happiness+effects.happiness,0,100);
    if (effects.shipCondition) state.shipCondition = clamp(state.shipCondition+effects.shipCondition,0,100);
    if (effects.reputation) state.reputation = clamp(state.reputation+effects.reputation,0,5);
    if (effects.fuel) state.fuel = clamp(state.fuel+effects.fuel,0,state.fuelMax);
    if (effects.food) state.food = clamp(state.food+effects.food,0,state.foodMax);
  }

  /* ============================== 5. RENDERING ================================= */

  const statusStripEl = document.getElementById('statusStrip');
  const resourceStripEl = document.getElementById('resourceStrip');
  const logEntriesEl = document.getElementById('logEntries');
  const toastEl = document.getElementById('toast');
  const saveIndicatorEl = document.getElementById('saveIndicator');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalBox = document.getElementById('modalBox');

  function renderStars(rep){
    let html = `<span class="stars" title="${rep.toFixed(1)} / 5 reputation">`;
    for (let i=0;i<5;i++){
      const fill = Math.max(0, Math.min(1, rep-i))*100;
      html += `<span class="star-slot"><span class="star-base">★</span><span class="star-fill" style="width:${fill}%">★</span></span>`;
    }
    return html + '</span>';
  }

  function renderBar(icon,label,value,max){
    const pct = Math.max(0, Math.min(100, Math.round((value/max)*100)));
    const level = pct < 30 ? 'low' : pct < 60 ? 'mid' : 'good';
    const valueText = max === 100 ? `${Math.round(value)}%` : `${Math.round(value)}/${max}`;
    return `<div class="resource-bar ${level}">
      <span class="rb-icon">${icon}</span>
      <span class="rb-label">${label}</span>
      <span class="rb-track"><span class="rb-fill" style="width:${pct}%"></span></span>
      <span class="rb-value">${valueText}</span>
    </div>`;
  }

  function renderStatusStrip(){
    let pips = '';
    for (let i=0;i<state.hoursMax;i++){
      pips += i < state.hours ? '<span class="pip">⏳</span>' : '<span class="pip pip-empty">⏳</span>';
    }
    statusStripEl.innerHTML = `
      <div class="stat-pill"><span class="label">Day</span><span class="value">${state.day}</span></div>
      <div class="stat-pill"><span class="label">Gold</span><span class="value">🪙 ${state.gold}</span></div>
      <div class="stat-pill">${renderStars(state.reputation)}</div>
      <div class="stat-pill"><span class="label">Hours</span><span class="value pips">${pips}</span></div>
      <div class="stat-pill"><span class="label">Passengers</span><span class="value">👥 ${state.passengers}/${state.passengersMax}</span></div>
    `;
  }

  function renderResourceStrip(){
    resourceStripEl.innerHTML =
      renderBar('🛠️','Condition', state.shipCondition, 100) +
      renderBar('🍞','Food', state.food, state.foodMax) +
      renderBar('⛽','Fuel', state.fuel, state.fuelMax) +
      renderBar('😊','Happiness', state.happiness, 100);
  }

  function renderLog(){
    const entries = state.log.slice(-40).slice().reverse();
    logEntriesEl.innerHTML = entries.length
      ? entries.map(e => `<div class="log-entry ${e.type}"><span class="log-day">Day ${e.day}</span><p>${e.text}</p></div>`).join('')
      : '<p class="log-empty">The log is empty. Set sail, Captain.</p>';
  }

  // ---- Promenade deck: small silhouette figures strolling the deck. ----
  // Deliberately abstract (no faces, no skin tones) — flat coat-and-hat
  // silhouettes in the style of old ocean-liner travel posters, in the same
  // spirit as Stardew's small, simple NPC sprites rather than detailed
  // portraits. Figure count follows `state.passengers`; palette and walking
  // speed follow `state.happiness`, so a gloomier ship visibly looks it.
  const PASSENGER_COLORS = ['#7a2e3d','#2f5d4f','#8a6f2f','#3a4a7a','#6b3f6b','#4f7a7a','#8a4a2f'];
  const MUTED_COLORS = ['#5a5248','#4a4f52','#57544a','#4a4f58','#524a52','#494f4f','#57504a'];
  const CREW_COLOR = '#e9dcc0';
  const SILHOUETTE_DARK = '#241a12';

  function moodTier(){
    if (state.happiness >= 75) return 'high';
    if (state.happiness >= 40) return 'mid';
    return 'low';
  }
  function promenadeFigureCount(){
    return clamp(Math.round(state.passengers/8), 3, 9);
  }

  function buildFigureSVG(id, x, laneY, color, hasHat){
    return `<g class="promenade-figure" id="${id}" transform="translate(${x},${laneY})">
      <g class="promenade-bob">
        <ellipse cx="0" cy="-1" rx="6" ry="1.6" fill="#000" opacity="0.18"/>
        <rect x="-4" y="-3.4" width="3" height="3" rx="1" fill="${SILHOUETTE_DARK}"/>
        <rect x="1" y="-3.4" width="3" height="3" rx="1" fill="${SILHOUETTE_DARK}"/>
        <path d="M-5,-3 L-6,-17 Q-6,-21 0,-21 Q6,-21 6,-17 L5,-3 Z" fill="${color}"/>
        <circle cx="0" cy="-24" r="3.4" fill="${SILHOUETTE_DARK}"/>
        ${hasHat ? `<ellipse cx="0" cy="-26.4" rx="4.6" ry="1.3" fill="${color}"/>` : ''}
      </g>
    </g>`;
  }

  let promenadeKey = null;
  let promenadeTweens = [];

  function renderPromenade(){
    const tier = moodTier();
    const n = promenadeFigureCount();
    const key = n + '-' + tier;
    if (key === promenadeKey) return; // nothing meaningful changed — leave the current stroll uninterrupted
    promenadeKey = key;

    promenadeTweens.forEach(t => t.kill());
    promenadeTweens = [];

    const group = document.getElementById('promenadeFigures');
    if (!group) return;

    const palette = tier === 'low' ? MUTED_COLORS : PASSENGER_COLORS;
    const lanes = [104, 116, 128];
    const speedBase = tier === 'high' ? 11 : tier === 'low' ? 22 : 16;

    let html = '';
    const specs = [];
    for (let i = 0; i < n; i++){
      const laneY = lanes[i % lanes.length];
      const dir = i % 2 === 0 ? 1 : -1;
      const startX = dir === 1 ? -20 - Math.random()*60 : 920 + Math.random()*60;
      const endX = dir === 1 ? 920 + Math.random()*60 : -20 - Math.random()*60;
      const color = i === 0 ? CREW_COLOR : palette[i % palette.length];
      const hasHat = i !== 0 && Math.random() > 0.4;
      const id = 'pf' + i;
      html += buildFigureSVG(id, startX, laneY, color, hasHat);
      specs.push({
        id, startX, endX,
        duration: speedBase + Math.random()*6,
        delay: Math.random()*4,
        bobAmp: tier === 'low' ? 1 : tier === 'high' ? 2.4 : 1.6,
        bobSpeed: tier === 'low' ? 0.42 : tier === 'high' ? 0.22 : 0.3
      });
    }
    group.innerHTML = html;

    if (typeof gsap === 'undefined' || prefersReducedMotion) return; // figures still show, just standing still

    specs.forEach(s => {
      const el = document.getElementById(s.id);
      if (!el) return;
      const bobEl = el.querySelector('.promenade-bob');
      promenadeTweens.push(gsap.to(el, { x: s.endX - s.startX, duration: s.duration, delay: s.delay, ease:'none', repeat:-1 }));
      promenadeTweens.push(gsap.to(bobEl, { y:-s.bobAmp, duration:s.bobSpeed, repeat:-1, yoyo:true, ease:'sine.inOut', delay:Math.random() }));
    });
  }

  function render(){
    renderStatusStrip();
    renderResourceStrip();
    renderLog();
    renderPromenade();
    const firstEntry = logEntriesEl.querySelector('.log-entry');
    if (firstEntry) anim(firstEntry, { opacity:1, x:0, duration:.35 }, { opacity:0, x:-10 });
  }

  /* ============================= 6. MODAL SYSTEM ================================ */

  function openModal(title, bodyHTML, buttons){
    modalBox.innerHTML = `
      <h2 class="modal-title">${title}</h2>
      <div class="modal-body">${bodyHTML}</div>
      <div class="modal-actions"></div>
    `;
    const actionsEl = modalBox.querySelector('.modal-actions');
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (b.primary ? 'primary' : 'secondary');
      btn.textContent = b.label;
      btn.addEventListener('click', b.onClick);
      actionsEl.appendChild(btn);
    });
    modalOverlay.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    anim(modalOverlay, { opacity:1, duration:.2 }, { opacity:0 });
    anim(modalBox, { opacity:1, scale:1, y:0, duration:.32, ease:'back.out(1.6)' }, { opacity:0, scale:.94, y:14 });
  }

  function closeModal(){
    anim(modalBox, { opacity:0, scale:.94, y:14, duration:.18 });
    anim(modalOverlay, { opacity:0, duration:.18, onComplete:() => { modalOverlay.classList.add('hidden'); document.body.style.overflow = mapExpanded ? 'hidden' : ''; } });
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.remove('hidden');
    anim(toastEl, { opacity:1, y:0, duration:.25 }, { opacity:0, y:10 });
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => {
      anim(toastEl, { opacity:0, y:10, duration:.25, onComplete:() => toastEl.classList.add('hidden') });
    }, 2200);
  }

  function flashSaveIndicator(){
    saveIndicatorEl.textContent = 'Voyage saved ✓';
    saveIndicatorEl.classList.add('show');
    clearTimeout(flashSaveIndicator._t);
    flashSaveIndicator._t = setTimeout(() => saveIndicatorEl.classList.remove('show'), 1800);
  }

  /* ============================== 7. ANIMATION ================================= */

  const prefersReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // Every animated transition in the game goes through anim(), so that a
  // failed GSAP load (or a reduced-motion preference) just snaps straight to
  // the end state instead of breaking anything.
  function anim(target, to, from){
    if (typeof gsap === 'undefined' || prefersReducedMotion){
      if (target && to) Object.assign(target.style, { opacity: to.opacity !== undefined ? to.opacity : '', transform:'' });
      if (typeof to?.onComplete === 'function') to.onComplete();
      return;
    }
    return from ? gsap.fromTo(target, from, to) : gsap.to(target, to);
  }

  function initHeroAnimations(){
    if (typeof gsap === 'undefined' || prefersReducedMotion) return;
    gsap.utils.toArray('.star').forEach((el,i) => {
      gsap.to(el, { opacity:0.15+Math.random()*0.3, duration:1.5+Math.random()*2, repeat:-1, yoyo:true, delay:i*0.15, ease:'sine.inOut' });
    });
    gsap.to('.smoke', { y:-34, opacity:0, scale:1.5, transformOrigin:'center', duration:3.2, repeat:-1, stagger:0.6, ease:'power1.out' });
    gsap.to('#shipGroup', { y:5, duration:2.6, repeat:-1, yoyo:true, ease:'sine.inOut' });
    gsap.to('.wave', { x:14, duration:4.2, repeat:-1, yoyo:true, ease:'sine.inOut', stagger:0.4 });
    gsap.to('.lamp-glow', { opacity:0.55, r:5, duration:1.8, repeat:-1, yoyo:true, ease:'sine.inOut' });
  }

      {

          if (state.day >= 8) out.push('"I have started writing it all down. Nobody at home will believe a ship can be this big otherwise."');

  const PLAYER_COLOR = '#2f5d8f';
  const PLAYER_RADIUS = 9;
  const PLAYER_SPEED = 158; // px/sec
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const MOVE_KEYS = { w:'up', a:'left', s:'down', d:'right', arrowup:'up', arrowleft:'left', arrowdown:'down', arrowright:'right' };

  // Lighting shifts through the day as the captain's working hours are spent.
  const TIME_OF_DAY = [
    { name:'Night',     tint:'20,30,64',  alpha:0.40 }, // 0 hours left
    { name:'Evening',   tint:'70,44,74',  alpha:0.26 },
    { name:'Afternoon', tint:'92,66,40',  alpha:0.12 },
    { name:'Midday',    tint:'255,238,200', alpha:0.05 },
    { name:'Morning',   tint:'150,170,200', alpha:0.10 }  // 4 hours left
  ];
  function timeOfDay(){ return TIME_OF_DAY[clamp(state.hours, 0, TIME_OF_DAY.length-1)]; }

  const heldKeys = new Set();
  const player = { map:'mainHall', x:381, y:430, isMoving:false, facing:'down', walkPhase:0 };
  let activeInteractable = null;
  let lastFrameTime = 0;
  let npcRuntime = [];
  let dustMotes = [];
  let staticLayer = null;

  const mapCanvasEl = document.getElementById('mapCanvas');
  const interactPromptEl = document.getElementById('interactPrompt');
  const mapTitleEl = document.getElementById('mapTitle');

  function currentMapDef(){ return MAPS[player.map]; }

  function circleRectOverlap(cx,cy,cr,rx,ry,rw,rh){
    const closestX = clamp(cx, rx, rx+rw);
    const closestY = clamp(cy, ry, ry+rh);
    const dx = cx-closestX, dy = cy-closestY;
    return (dx*dx+dy*dy) < (cr*cr);
  }

  function collidesAt(map, x, y, r){
    const t = map.wallThickness;
    const walls = [
      { x:0, y:0, w:map.width, h:t },
      { x:0, y:map.height-t, w:map.width, h:t },
      { x:0, y:0, w:t, h:map.height },
      { x:map.width-t, y:0, w:t, h:map.height }
    ];
    for (const w of walls) if (circleRectOverlap(x,y,r,w.x,w.y,w.w,w.h)) return true;
    for (const o of map.obstacles) if (circleRectOverlap(x,y,r,o.x,o.y,o.w,o.h)) return true;
    return false;
  }

  // ---- NPCs ----------------------------------------------------------------

  function spawnNpcsForMap(mapId){
    const defs = NPCS[mapId] || [];
    npcRuntime = defs.map(def => ({
      def,
      id: def.id,
      x: def.x, y: def.y,
      homeX: def.x, homeY: def.y,
      targetX: def.x, targetY: def.y,
      pauseFor: Math.random()*2,
      isMoving: false,
      facing: 'down',
      walkPhase: Math.random()*10
    }));
  }

  function pickNpcTarget(npc){
    const map = currentMapDef();
    for (let tries = 0; tries < 12; tries++){
      const a = Math.random()*Math.PI*2;
      const d = Math.random()*npc.def.wanderRadius;
      const tx = npc.homeX + Math.cos(a)*d;
      const ty = npc.homeY + Math.sin(a)*d;
      if (!collidesAt(map, tx, ty, 8)) { npc.targetX = tx; npc.targetY = ty; return; }
    }
    npc.targetX = npc.homeX; npc.targetY = npc.homeY;
  }

  function updateNpcs(dt){
    const map = currentMapDef();
    npcRuntime.forEach(npc => {
      if (npc.pauseFor > 0){
        npc.pauseFor -= dt;
        npc.isMoving = false;
        return;
      }
      const dx = npc.targetX - npc.x, dy = npc.targetY - npc.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 3){
        npc.pauseFor = 1 + Math.random()*4;
        pickNpcTarget(npc);
        npc.isMoving = false;
        return;
      }
      const step = npc.def.speed * dt;
      const nx = npc.x + (dx/dist)*step;
      const ny = npc.y + (dy/dist)*step;
      let moved = false;
      if (!collidesAt(map, nx, npc.y, 8)){ npc.x = nx; moved = true; }
      if (!collidesAt(map, npc.x, ny, 8)){ npc.y = ny; moved = true; }
      if (!moved){ npc.pauseFor = 0.4; pickNpcTarget(npc); }
      npc.facing = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      npc.isMoving = moved;
      npc.walkPhase += dt * 9;
    });
  }

  function talkToNpc(npc){
    const def = npc.def;
    const alreadyToday = !!state.npcTalks[def.id];
    const lines = def.lines();
    const line = pickOne(lines);
    let footer = '';

    if (!alreadyToday){
      state.npcTalks[def.id] = true;
      state.friendship[def.id] = (state.friendship[def.id] || 0) + 1;
      state.happiness = clamp(state.happiness + 1, 0, 100);
      const f = state.friendship[def.id];
      if (f === 3) footer = `<p class="modal-hint">${def.name} seems glad to see you coming.</p>`;
      else if (f === 8) footer = `<p class="modal-hint">${def.name} counts you a friend now.</p>`;
      else if (f === 15) footer = `<p class="modal-hint">After all these days at sea, ${def.name} would follow you onto any ship.</p>`;
      else footer = `<p class="modal-hint">Spirits aboard lift a little. (Friendship ${f})</p>`;
      render();
      saveGame();
    } else {
      footer = '<p class="modal-hint">You have already spoken today, but the company is welcome all the same.</p>';
    }

    openModal(def.name, `<p>${line}</p>${footer}`, [
      { label:'Take your leave', primary:true, onClick: closeModal }
    ]);
  }

  // ---- Player --------------------------------------------------------------

  function updatePlayer(dt){
    const map = currentMapDef();
    if (!modalOverlay.classList.contains('hidden')){
      player.isMoving = false;
      return; // pause exploration while any dialog is open
    }
    let dx = 0, dy = 0;
    if (heldKeys.has('up')) dy -= 1;
    if (heldKeys.has('down')) dy += 1;
    if (heldKeys.has('left')) dx -= 1;
    if (heldKeys.has('right')) dx += 1;
    if (dx !== 0 && dy !== 0){ dx *= 0.7071; dy *= 0.7071; }

    if (dx !== 0){
      const nx = player.x + dx*PLAYER_SPEED*dt;
      if (!collidesAt(map, nx, player.y, PLAYER_RADIUS)) player.x = nx;
    }
    if (dy !== 0){
      const ny = player.y + dy*PLAYER_SPEED*dt;
      if (!collidesAt(map, player.x, ny, PLAYER_RADIUS)) player.y = ny;
    }
    player.x = clamp(player.x, map.wallThickness+PLAYER_RADIUS, map.width-map.wallThickness-PLAYER_RADIUS);
    player.y = clamp(player.y, map.wallThickness+PLAYER_RADIUS, map.height-map.wallThickness-PLAYER_RADIUS);
    player.isMoving = dx !== 0 || dy !== 0;
    if (player.isMoving){
      player.facing = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      player.walkPhase += dt * 11;
    }

    // Nearest thing worth pressing E on — props and people compete on distance.
    let nearest = null, nearestDist = Infinity;
    for (const it of map.interactables){
      const d = Math.hypot(player.x-it.x, player.y-it.y);
      if (d <= (it.radius || 42) && d < nearestDist){ nearest = it; nearestDist = d; }
    }
    for (const npc of npcRuntime){
      const d = Math.hypot(player.x-npc.x, player.y-npc.y);
      if (d <= 40 && d < nearestDist){
        nearest = { type:'npc', npc, label:'Talk to ' + npc.def.name };
        nearestDist = d;
      }
    }
    activeInteractable = nearest;
  }

  // The floor, rugs and lamplight never change once a map is built, so they're
  // rendered once into an offscreen canvas and blitted each frame rather than
  // re-running the whole parquet pattern 60 times a second.
  function buildStaticLayer(map){
    let off;
    try {
      off = document.createElement('canvas');
      off.width = map.width * DPR;
      off.height = map.height * DPR;
      const octx = off.getContext('2d');
      if (!octx) return null;
      octx.setTransform(DPR, 0, 0, DPR, 0, 0);
      drawFloor(octx, map);
      drawDecor(octx, map);
      drawLights(octx, map);
      return off;
    } catch (e){
      return null; // fall back to drawing the floor live
    }
  }

  function updateMapMeta(){
    const map = currentMapDef();
    if (mapTitleEl) mapTitleEl.textContent = map.name;
    if (mapCanvasEl){
      mapCanvasEl.width = map.width * DPR;
      mapCanvasEl.height = map.height * DPR;
      mapCanvasEl.style.aspectRatio = map.width + ' / ' + map.height;
    }
    staticLayer = buildStaticLayer(map);
    dustMotes = [];
    for (let i = 0; i < 22; i++){
      dustMotes.push({
        x: Math.random()*map.width,
        y: Math.random()*map.height,
        r: 0.6 + Math.random()*1.2,
        drift: 4 + Math.random()*10,
        phase: Math.random()*Math.PI*2
      });
    }
  }

  function goToMap(mapId, spawn){
    const map = MAPS[mapId];
    if (!map) return;
    player.map = mapId;
    player.x = spawn ? spawn.x : map.spawn.x;
    player.y = spawn ? spawn.y : map.spawn.y;
    player.facing = 'down';
    activeInteractable = null;
    state.currentMap = mapId;
    spawnNpcsForMap(mapId);
    updateMapMeta();
    saveGame();
  }

  function handleInteract(){
    if (!modalOverlay.classList.contains('hidden')) return;
    const it = activeInteractable;
    if (!it) return;
    if (it.type === 'room') doRoom(it.roomId);
    else if (it.type === 'shipyard') openShipyard();
    else if (it.type === 'sleep') endDayFlow();
    else if (it.type === 'door') goToMap(it.targetMap, it.targetSpawn);
    else if (it.type === 'npc') talkToNpc(it.npc);
    else if (it.type === 'clock') openClock();
    else if (it.type === 'gauge') openGauge();
    else if (it.type === 'logbook') openLogbook();
    else if (it.type === 'piano') openPiano();
    else if (it.type === 'flavor') openFlavor(it);
  }

  // A generic "look at this" interactable. Give a map entry a `text` — either a
  // string or a function of state — and it becomes a readable piece of scenery
  // with no other wiring needed.
  function openFlavor(it){
    const body = typeof it.text === 'function' ? it.text() : (it.text || '<p>Nothing much to see.</p>');
    openModal(it.label || 'A Closer Look', body, [
      { label:'Move on', primary:true, onClick: closeModal }
    ]);
  }

  // Standing by the piano while the trio plays lifts the room. Like talking to
  // someone, it pays out once a day and costs no working hours.
  function openPiano(){
    const already = !!state.npcTalks.__piano;
    let footer;
    if (!already){
      state.npcTalks.__piano = true;
      state.happiness = clamp(state.happiness + 2, 0, 100);
      footer = '<p class="modal-hint">You stay for the whole piece. The saloon feels warmer for it.</p>';
      render();
      saveGame();
    } else {
      footer = '<p class="modal-hint">You have already stopped to listen today.</p>';
    }
    const body = state.happiness >= 70
      ? '<p>Encik Salleh has the saloon in his hand. Mei Ling comes in over the top of him, and somewhere behind you a table stops talking to listen.</p>'
      : '<p>Encik Salleh plays on to a half-attentive room. It is good playing. It deserves a better night than this one.</p>';
    openModal('The Grand Piano', body + footer, [
      { label:'Move on', primary:true, onClick: closeModal }
    ]);
  }

  function openGauge(){
    const pct = Math.round((state.fuel / Math.max(state.fuelMax,1)) * 100);
    const verdict = pct >= 70
      ? 'The needle sits high and steady. There is coal enough to drive her hard.'
      : pct >= 35
        ? 'The needle rests in the middle of the dial. Comfortable, but not generous.'
        : 'The needle hangs low, well into the red. The bunkers want filling badly.';
    openModal('Pressure Gauge', `
      <p>The brass dial reads <strong>${pct}%</strong> — ${state.fuel} of ${state.fuelMax} measures of coal remaining.</p>
      <p>${verdict}</p>
      <p class="modal-hint">The bunkers take on ${20} more each morning while she is under way.</p>
    `, [{ label:'Step back', primary:true, onClick: closeModal }]);
  }

  function openClock(){
    const tod = timeOfDay();
    const hoursText = state.hours === 0
      ? 'The working day is done. Your bed is waiting in the Captain\'s Room.'
      : `You have <strong>${state.hours}</strong> working hour${state.hours===1?'':'s'} left before you turn in.`;
    openModal('The Grand Clock', `
      <p>The great brass clock at the head of the staircase reads <strong>${tod.name.toLowerCase()}</strong> on day ${state.day} of the voyage.</p>
      <p>${hoursText}</p>
    `, [{ label:'Step away', primary:true, onClick: closeModal }]);
  }

  function openLogbook(){
    const recent = state.log.slice(-6).reverse();
    const body = recent.length
      ? recent.map(e => `<p><span class="modal-hint">Day ${e.day} — </span>${e.text}</p>`).join('')
      : '<p>The pages are still blank. The voyage has barely begun.</p>';
    const friends = Object.keys(state.friendship || {});
    const friendLine = friends.length
      ? `<p class="modal-hint">Aboard you count ${friends.length} familiar face${friends.length===1?'':'s'}.</p>`
      : '';
    openModal("Ship's Logbook", body + friendLine, [
      { label:'Close the book', primary:true, onClick: closeModal }
    ]);
  }

  function updateInteractionPrompt(){
    if (!interactPromptEl) return;
    if (activeInteractable){
      interactPromptEl.textContent = '[E] ' + (activeInteractable.label || 'Interact');
      interactPromptEl.classList.remove('hidden');
    } else {
      interactPromptEl.classList.add('hidden');
    }
  }

  // ---- Drawing -------------------------------------------------------------
  // Characters share one routine so the player, passengers and crew all read
  // as the same species of little flat-coated silhouette — same visual family
  // as the promenade figures up top.

  function drawCharacter(ctx, x, y, opts){
    const { color, facing = 'down', walkPhase = 0, isMoving = false, hat = false, small = false, crew = false } = opts;
    const s = small ? 0.78 : 1;
    const swing = isMoving ? Math.sin(walkPhase) * 3 : 0;
    const bob = isMoving ? Math.abs(Math.sin(walkPhase)) * 1.4 : 0;
    const yy = y - bob;

    ctx.save();
    ctx.translate(x, yy);
    ctx.scale(s, s);

    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(0, 1, 8, 2.6, 0, 0, Math.PI*2); ctx.fill();

    // legs
    ctx.fillStyle = SILHOUETTE_DARK;
    if (facing === 'left' || facing === 'right'){
      ctx.fillRect(-2.2 + swing*0.5, -5, 3.4, 6);
      ctx.fillRect(-2.2 - swing*0.5, -5, 3.4, 6);
    } else {
      ctx.fillRect(-5 + swing, -5, 3.6, 6);
      ctx.fillRect(1.4 - swing, -5, 3.6, 6);
    }

    // coat
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-6.4, -4);
    ctx.lineTo(-7.2, -19);
    ctx.quadraticCurveTo(-7.2, -23.5, 0, -23.5);
    ctx.quadraticCurveTo(7.2, -23.5, 7.2, -19);
    ctx.lineTo(6.4, -4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // coat detail — a lapel seam facing the viewer, or a crew stripe
    if (facing !== 'up'){
      ctx.strokeStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath(); ctx.moveTo(0, -21); ctx.lineTo(0, -6); ctx.stroke();
    }
    if (crew){
      ctx.fillStyle = 'rgba(201,162,75,0.9)';
      ctx.fillRect(-6.6, -9, 13.2, 1.6);
    }

    // arms
    ctx.fillStyle = color;
    ctx.save();
    ctx.globalAlpha = 0.92;
    if (facing === 'left' || facing === 'right'){
      ctx.fillRect(-1.6, -19 + swing*0.6, 3.2, 11);
    } else {
      ctx.fillRect(-9.4, -19 - swing*0.4, 3.2, 11);
      ctx.fillRect(6.2, -19 + swing*0.4, 3.2, 11);
    }
    ctx.restore();

    // head
    ctx.fillStyle = SILHOUETTE_DARK;
    ctx.beginPath(); ctx.arc(0, -27, 4.4, 0, Math.PI*2); ctx.fill();

    if (hat){
      ctx.fillStyle = crew ? '#e9dcc0' : color;
      ctx.beginPath(); ctx.ellipse(0, -29.6, 6.2, 1.8, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-3.4, -33.4, 6.8, 4);
      if (crew){
        ctx.fillStyle = 'rgba(201,162,75,0.95)';
        ctx.fillRect(-3.4, -30.8, 6.8, 1.4);
      }
    }
    ctx.restore();
  }

  function drawObstacle(ctx, o, t){
    const cx = o.x + o.w/2, cy = o.y + o.h/2;
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = SILHOUETTE_DARK;

    switch (o.type){
      case 'stairs': {
        // Carpeted grand staircase, widening toward the viewer, with
        // balustrades and a landing — the centrepiece of the hall.
        const steps = 7, stepH = o.h/steps;
        for (let i = 0; i < steps; i++){
          const f = i/(steps-1);
          const stepW = o.w * (0.52 + 0.48*f);
          const sx = cx - stepW/2, sy = o.y + i*stepH;
          ctx.fillStyle = i % 2 === 0 ? '#8a6f2f' : '#a08348';
          ctx.fillRect(sx, sy, stepW, stepH - 1.5);
          ctx.fillStyle = 'rgba(107,44,58,0.85)'; // carpet runner down the middle
          ctx.fillRect(cx - stepW*0.22, sy, stepW*0.44, stepH - 1.5);
          ctx.strokeStyle = 'rgba(0,0,0,0.25)';
          ctx.beginPath(); ctx.moveTo(sx, sy + stepH - 1.5); ctx.lineTo(sx + stepW, sy + stepH - 1.5); ctx.stroke();
        }
        // balustrades along both flanks
        ctx.strokeStyle = 'rgba(201,162,75,0.85)';
        ctx.lineWidth = 2.5;
        for (const side of [-1, 1]){
          ctx.beginPath();
          ctx.moveTo(cx + side*(o.w*0.26), o.y);
          ctx.lineTo(cx + side*(o.w*0.5), o.y + o.h);
          ctx.stroke();
        }
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(201,162,75,0.5)';
        for (let i = 0; i < steps; i++){
          const f = i/(steps-1);
          const halfW = o.w * (0.26 + 0.24*f);
          const yy = o.y + i*stepH;
          for (const side of [-1, 1]){
            ctx.beginPath(); ctx.moveTo(cx + side*halfW, yy); ctx.lineTo(cx + side*halfW, yy - 7); ctx.stroke();
          }
        }
        break;
      }
      case 'palm': {
        ctx.fillStyle = '#8a5a33';
        ctx.beginPath();
        ctx.moveTo(cx-9, o.y+o.h); ctx.lineTo(cx-6, o.y+o.h-13);

      case 'bench': {

      }
      case 'table': {
        ctx.fillStyle = '#6b4a2f';

      case 'furnaces': {
        // A bank of four furnace doors set into the forward bulkhead. The fire
        // behind each one flickers on its own offset so they never pulse in sync.
        ctx.fillStyle = '#1c1512';

        ctx.strokeStyle = '#0f0b09'; ctx.lineWidth = 2;
        ctx.strokeRect(o.x, o.y, o.w, o.h);
        const n = 4, pad = 14;
        const dw = (o.w - pad*(n+1)) / n;
        for (let i = 0; i < n; i++){
          const dx = o.x + pad + i*(dw+pad);
          const dy = o.y + 12;
          const dh = o.h - 24;
          const flick = 0.55 + Math.sin(t*3.1 + i*1.7)*0.16 + Math.sin(t*7.3 + i*0.9)*0.08;
          const gg = ctx.createLinearGradient(dx, dy, dx, dy+dh);
          gg.addColorStop(0, `rgba(255,196,90,${0.85*flick})`);
          gg.addColorStop(0.55, `rgba(233,110,40,${0.95*flick})`);
          gg.addColorStop(1, `rgba(140,36,20,${0.9*flick})`);
          ctx.fillStyle = gg;
          ctx.fillRect(dx, dy, dw, dh);
          ctx.strokeStyle = '#c9a24b'; ctx.lineWidth = 2;
          ctx.strokeRect(dx, dy, dw, dh);
          // iron cross-brace and handle on each door
          ctx.strokeStyle = 'rgba(28,21,18,0.75)'; ctx.lineWidth = 3;

          ctx.fillStyle = '#8a6f2f';
          ctx.fillRect(dx+dw/2-2, dy+dh/2-7, 4, 14);
        }
        break;
      }
      case 'machine': {
        // The reciprocating engine block: cylinders, piston rods, flywheel.
        ctx.fillStyle = '#3d3630';
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeStyle = '#1c1512'; ctx.lineWidth = 2;
        ctx.strokeRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle = '#4f4740';
        for (let i = 0; i < 3; i++){
          const cx2 = o.x + 22 + i*((o.w-44)/2);
          ctx.beginPath(); ctx.arc(cx2, o.y + 24, 13, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#8a6f2f'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(cx2, o.y + 24, 13, 0, Math.PI*2); ctx.stroke();
          // piston rod pumping in and out
          const throw_ = Math.sin(t*2.4 + i*2.1) * 7;
          ctx.strokeStyle = '#c9a24b'; ctx.lineWidth = 3.5;

          ctx.moveTo(cx2, o.y + 34);

        ctx.beginPath(); ctx.moveTo(o.x+10, o.y+o.h-16); ctx.lineTo(o.x+o.w-10, o.y+o.h-16); ctx.stroke();
        ctx.fillStyle = '#2a2320';
        ctx.beginPath(); ctx.arc(o.x + o.w - 24, o.y + o.h - 16, 11, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#c9a24b'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(o.x + o.w - 24, o.y + o.h - 16, 11, 0, Math.PI*2); ctx.stroke();
        for (let i = 0; i < 6; i++){
          const a = (i/6)*Math.PI*2 + t*1.6;
          ctx.beginPath();
          ctx.moveTo(o.x + o.w - 24, o.y + o.h - 16);

      }
      case 'coal': {
        ctx.fillStyle = '#1a1614';
        ctx.beginPath();
        ctx.moveTo(o.x, o.y + o.h);
        ctx.quadraticCurveTo(o.x + o.w*0.22, o.y + o.h*0.18, o.x + o.w*0.5, o.y + o.h*0.3);
        ctx.quadraticCurveTo(o.x + o.w*0.78, o.y + o.h*0.42, o.x + o.w, o.y + o.h);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(120,110,105,0.5)'; // a few lumps catching the firelight
        for (let i = 0; i < 7; i++){
          const lx = o.x + 8 + ((i*13) % (o.w-14));
          const ly = o.y + o.h - 6 - ((i*9) % (o.h-14));
          ctx.beginPath(); ctx.arc(lx, ly, 2.2, 0, Math.PI*2); ctx.fill();
        }
        break;
      }
      case 'roundtable': {
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath(); ctx.ellipse(cx, cy+4, o.w/2, o.h/2.6, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#f4ecdc'; // white linen to the deck
        ctx.beginPath(); ctx.ellipse(cx, cy, o.w/2, o.h/2, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(120,100,70,0.5)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.ellipse(cx, cy, o.w/2, o.h/2, 0, 0, Math.PI*2); ctx.stroke();
        // place settings around the cloth
        for (let i = 0; i < 4; i++){
          const a = (i/4)*Math.PI*2 + Math.PI/4;
          const px = cx + Math.cos(a)*(o.w*0.3), py = cy + Math.sin(a)*(o.h*0.3);
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = 'rgba(201,162,75,0.8)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI*2); ctx.stroke();
        }
        // centrepiece
        ctx.fillStyle = '#2f5d4f';
        ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#a8567a';
        ctx.beginPath(); ctx.arc(cx, cy-3, 3.4, 0, Math.PI*2); ctx.fill();
        break;
      }
      case 'roundcloth': {
        ctx.fillStyle = '#f4ecdc';
        ctx.beginPath(); ctx.ellipse(cx, cy, o.w/2, o.h/2, 0, 0, Math.PI*2); ctx.fill();
        break;
      }
      case 'piano': {
        // grand piano seen from above: curved case, raised lid, keyboard
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath(); ctx.ellipse(cx, o.y+o.h-4, o.w/2, 8, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#241a12';
        ctx.beginPath();
        ctx.moveTo(o.x, o.y + o.h);
        ctx.lineTo(o.x, o.y + 14);
        ctx.quadraticCurveTo(o.x, o.y, o.x + o.w*0.42, o.y);
        ctx.quadraticCurveTo(o.x + o.w, o.y + 4, o.x + o.w, o.y + o.h*0.62);
        ctx.quadraticCurveTo(o.x + o.w, o.y + o.h, o.x + o.w*0.6, o.y + o.h);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#c9a24b'; ctx.lineWidth = 1.6; ctx.stroke();
        // open lid catching the light
        ctx.fillStyle = 'rgba(201,162,75,0.16)';
        ctx.beginPath();
        ctx.moveTo(o.x + 6, o.y + 12);
        ctx.quadraticCurveTo(o.x + o.w*0.5, o.y + 6, o.x + o.w - 10, o.y + o.h*0.5);
        ctx.lineTo(o.x + o.w - 22, o.y + o.h*0.52);
        ctx.quadraticCurveTo(o.x + o.w*0.5, o.y + 18, o.x + 12, o.y + 20);
        ctx.closePath(); ctx.fill();
        // keyboard along the straight edge
        ctx.fillStyle = '#f4ecdc';
        ctx.fillRect(o.x + 3, o.y + o.h - 13, o.w*0.5, 10);
        ctx.strokeStyle = '#241a12'; ctx.lineWidth = 0.9;
        for (let k = 0; k < 13; k++){
          const kx = o.x + 4 + k*((o.w*0.5-2)/13);
          ctx.beginPath(); ctx.moveTo(kx, o.y + o.h - 13); ctx.lineTo(kx, o.y + o.h - 3); ctx.stroke();
        }
        ctx.fillStyle = '#241a12';
        for (let k = 0; k < 13; k++){
          if (k % 7 === 2 || k % 7 === 6) continue;
          const kx = o.x + 4 + k*((o.w*0.5-2)/13);
          ctx.fillRect(kx + 1.4, o.y + o.h - 13, 2.2, 6);

        ctx.globalAlpha = 1;
        break;
      }
      case 'sideboard': {
        ctx.fillStyle = '#5c3a24';
        ctx.fillRect(o.x, o.y, o.w, o.h); ctx.strokeRect(o.x, o.y, o.w, o.h);
        ctx.strokeStyle = 'rgba(201,162,75,0.6)'; ctx.lineWidth = 1;
        ctx.strokeRect(o.x+4, o.y+4, o.w/2-6, o.h-8);
        ctx.strokeRect(o.x+o.w/2+2, o.y+4, o.w/2-6, o.h-8);

        ctx.fillRect(o.x+10, o.y-6, 16, 6);
        ctx.fillRect(o.x+o.w-30, o.y-6, 16, 6);
        break;
      }
      case 'bunk': {
        // a two-tier iron berth seen from above, blanket folded on the lower
        ctx.fillStyle = '#3d342a';
        ctx.fillRect(o.x, o.y, o.w, o.h); ctx.strokeRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle = '#5c6b74'; // iron frame
        ctx.fillRect(o.x, o.y, o.w, 5);
        ctx.fillRect(o.x, o.y+o.h-5, o.w, 5);
        ctx.fillStyle = '#8a8272'; // mattress
        ctx.fillRect(o.x+5, o.y+7, o.w-10, o.h-14);

      }
      case 'trunk': {
        ctx.fillStyle = '#5c3a24';
        ctx.fillRect(o.x, o.y, o.w, o.h); ctx.strokeRect(o.x, o.y, o.w, o.h);
        ctx.strokeStyle = '#c9a24b'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(o.x+10, o.y); ctx.lineTo(o.x+10, o.y+o.h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(o.x+o.w-10, o.y); ctx.lineTo(o.x+o.w-10, o.y+o.h); ctx.stroke();
        ctx.fillStyle = '#c9a24b';

        ctx.fillStyle = '#4a4038';
        ctx.beginPath();
        ctx.moveTo(o.x, o.y+o.h); ctx.lineTo(o.x+4, o.y);
        ctx.lineTo(o.x+o.w-4, o.y); ctx.lineTo(o.x+o.w, o.y+o.h);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#1a1614'; // heaped coal
        ctx.beginPath(); ctx.ellipse(cx, o.y+o.h*0.45, o.w*0.34, o.h*0.3, 0, 0, Math.PI*2); ctx.fill();

        ctx.beginPath(); ctx.arc(o.x+o.w-2, o.y+o.h, 5, 0, Math.PI*2); ctx.fill();

      }
      default: {
        ctx.fillStyle = '#3a2a1c';
        ctx.fillRect(o.x, o.y, o.w, o.h);
      }
    }
  }

  function drawPropShape(ctx, it, t){

        ctx.beginPath(); ctx.arc(it.x-4, it.y-18, 1.8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(it.x-4, it.y+1, 1.8, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = '#7a9ab3';
        ctx.fillRect(it.x-12, it.y-33, 24, 5); ctx.strokeRect(it.x-12, it.y-33, 24, 5);
        break;
      case 'bed':

        ctx.fillStyle = '#e9dcc0'; // pillow
        ctx.fillRect(it.x-22, it.y-9, 17, 11);
        ctx.strokeRect(it.x-22, it.y-9, 17, 11);

      case 'lectern':
        ctx.fillStyle = '#6b4a2f';
        ctx.fillRect(it.x-4, it.y-2, 8, 12);
        ctx.fillRect(it.x-11, it.y+8, 22, 4);
        ctx.strokeRect(it.x-11, it.y+8, 22, 4);

        // red zone on the dial

        // needle reads the coal in the bunkers

      case 'servinghatch': {
